<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어금니 과일 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            cursor: pointer;
        }

        #canvas-container { width: 100vw; height: 100vh; }

        #info {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
            pointer-events: none;
        }

        #fruit-name {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.4s, transform 0.4s;
        }

        #fruit-name.changing {
            opacity: 0;
            transform: translateX(-50%) translateY(-10px);
        }

        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 9999;
            padding: 8px 14px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.8rem;
            font-family: monospace;
            text-decoration: none;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
        }

        .back-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <a href="../bridge.html" class="back-btn">← 목록</a>
    <div id="canvas-container"></div>
    <div id="fruit-name">🍓 딸기</div>
    <div id="info">클릭하면 과일이 바뀝니다</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 과일 데이터
        const fruits = [
            {
                name: '🍓 딸기',
                outerColor: 0xcc1133,
                innerColor: 0xff4466,
                coreColor: 0xffeaea,
                veinColor: 0xffcccc,
                seedColor: 0xffdd44,
            },
            {
                name: '🍉 수박',
                outerColor: 0x2d7a2d,
                innerColor: 0xff2233,
                coreColor: 0xff8899,
                veinColor: 0xff6677,
                seedColor: 0x111111,
            },
            {
                name: '🥝 키위',
                outerColor: 0x5c3d1e,
                innerColor: 0x88cc22,
                coreColor: 0xeeffcc,
                veinColor: 0xaadd55,
                seedColor: 0x1a1a1a,
            },
            {
                name: '🍊 오렌지',
                outerColor: 0xff7700,
                innerColor: 0xffaa22,
                coreColor: 0xfff0cc,
                veinColor: 0xffcc77,
                seedColor: 0xffbb44,
            },
            {
                name: '🍇 포도',
                outerColor: 0x3d0055,
                innerColor: 0x8833aa,
                coreColor: 0xddbbff,
                veinColor: 0xaa66cc,
                seedColor: 0x220033,
            }
        ];

        let currentFruitIndex = 0;
        let scene, camera, renderer, controls, toothGroup;
        let isAnimating = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 6);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.minDistance = 3;
            controls.maxDistance = 10;

            // 조명
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
            keyLight.position.set(4, 6, 5);
            keyLight.castShadow = true;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x8899ff, 0.4);
            fillLight.position.set(-4, 2, 3);
            scene.add(fillLight);

            const backLight = new THREE.DirectionalLight(0xffeedd, 0.6);
            backLight.position.set(0, -2, -5);
            scene.add(backLight);

            const topLight = new THREE.PointLight(0xffffff, 0.3, 10);
            topLight.position.set(0, 5, 0);
            scene.add(topLight);

            createMolarTooth(fruits[currentFruitIndex]);

            renderer.domElement.addEventListener('click', onClickHandler);
            window.addEventListener('resize', onResize);

            animate();
        }

        function createMolarTooth(fruit) {
            if (toothGroup) {
                scene.remove(toothGroup);
                toothGroup.traverse((child) => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                        else child.material.dispose();
                    }
                });
            }

            toothGroup = new THREE.Group();

            const outerMaterial = new THREE.MeshPhysicalMaterial({
                color: fruit.outerColor,
                roughness: 0.45,
                metalness: 0.0,
                clearcoat: 0.3,
                clearcoatRoughness: 0.4,
                side: THREE.DoubleSide
            });

            // 메인 바디
            const bodyGeometry = new THREE.SphereGeometry(1, 64, 64);
            bodyGeometry.scale(1, 0.85, 0.7);
            const body = new THREE.Mesh(bodyGeometry, outerMaterial);
            body.position.y = 0.3;
            body.castShadow = true;
            toothGroup.add(body);

            // 두 봉우리
            const cuspGeometry = new THREE.SphereGeometry(0.55, 48, 48);

            const leftCusp = new THREE.Mesh(cuspGeometry, outerMaterial.clone());
            leftCusp.position.set(-0.4, 1.0, 0);
            leftCusp.scale.set(1, 0.8, 0.8);
            toothGroup.add(leftCusp);

            const rightCusp = new THREE.Mesh(cuspGeometry.clone(), outerMaterial.clone());
            rightCusp.position.set(0.4, 1.0, 0);
            rightCusp.scale.set(1, 0.8, 0.8);
            toothGroup.add(rightCusp);

            // 뿌리
            const rootGeometry = createRootGeometry();
            const rootMaterial = new THREE.MeshPhysicalMaterial({
                color: fruit.outerColor,
                roughness: 0.6,
                clearcoat: 0.1
            });

            const leftRoot = new THREE.Mesh(rootGeometry, rootMaterial);
            leftRoot.position.set(-0.35, -0.7, 0);
            leftRoot.rotation.z = 0.15;
            toothGroup.add(leftRoot);

            const rightRoot = new THREE.Mesh(rootGeometry.clone(), rootMaterial.clone());
            rightRoot.position.set(0.35, -0.7, 0);
            rightRoot.rotation.z = -0.15;
            toothGroup.add(rightRoot);

            // 단면
            createFruitCrossSection(fruit);

            toothGroup.position.y = -0.2;
            scene.add(toothGroup);
        }

        function createRootGeometry() {
            const points = [];
            for (let i = 0; i <= 20; i++) {
                const t = i / 20;
                const radius = 0.25 * (1 - t * 0.85) * (1 + 0.1 * Math.sin(t * Math.PI));
                points.push(new THREE.Vector2(radius, -t * 1.3));
            }
            return new THREE.LatheGeometry(points, 32);
        }

        function createFruitCrossSection(fruit) {
            const crossSection = new THREE.Mesh(
                new THREE.CircleGeometry(0.75, 64),
                new THREE.MeshPhysicalMaterial({ color: fruit.innerColor, roughness: 0.7, side: THREE.FrontSide })
            );
            crossSection.position.set(0, 0.3, 0.71);
            toothGroup.add(crossSection);

            const core = new THREE.Mesh(
                new THREE.CircleGeometry(0.25, 48),
                new THREE.MeshStandardMaterial({ color: fruit.coreColor, roughness: 0.5, side: THREE.FrontSide })
            );
            core.position.set(0, 0.3, 0.72);
            toothGroup.add(core);

            // 방사형 줄기
            for (let i = 0; i < 16; i++) {
                const angle = (i / 16) * Math.PI * 2;
                const pts = [];
                for (let j = 0; j <= 10; j++) {
                    const t = j / 10;
                    const r = 0.1 + t * 0.45;
                    const wobble = Math.sin(t * Math.PI) * 0.02;
                    pts.push(new THREE.Vector3(
                        Math.cos(angle + wobble) * r,
                        0.3 + Math.sin(angle + wobble) * r,
                        0.725
                    ));
                }
                const curve = new THREE.CatmullRomCurve3(pts);
                const vein = new THREE.Mesh(
                    new THREE.TubeGeometry(curve, 8, 0.012, 6, false),
                    new THREE.MeshStandardMaterial({ color: fruit.veinColor, roughness: 0.6, transparent: true, opacity: 0.6 })
                );
                toothGroup.add(vein);
            }

            // 씨앗
            for (let i = 0; i < 10; i++) {
                const angle = (i / 10) * Math.PI * 2 + Math.random() * 0.3;
                const radius = 0.35 + Math.random() * 0.2;
                const seedGeo = new THREE.SphereGeometry(0.035, 12, 12);
                seedGeo.scale(1, 1.4, 0.5);
                const seed = new THREE.Mesh(seedGeo, new THREE.MeshStandardMaterial({ color: fruit.seedColor, roughness: 0.2, metalness: 0.1 }));
                seed.position.set(Math.cos(angle) * radius, 0.3 + Math.sin(angle) * radius, 0.73);
                seed.rotation.z = angle;
                toothGroup.add(seed);
            }

            // 외곽 링
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(0.75, 0.04, 16, 64),
                new THREE.MeshPhysicalMaterial({ color: fruit.outerColor, roughness: 0.3, clearcoat: 0.5 })
            );
            ring.position.set(0, 0.3, 0.71);
            toothGroup.add(ring);
        }

        // 클릭
        let mouseDownTime = 0, mouseDownPos = { x: 0, y: 0 };

        function onClickHandler(e) {
            const timeDiff = Date.now() - mouseDownTime;
            const posDiff = Math.abs(e.clientX - mouseDownPos.x) + Math.abs(e.clientY - mouseDownPos.y);
            if (timeDiff < 300 && posDiff < 10) changeFruit();
        }

        function changeFruit() {
            if (isAnimating) return;
            isAnimating = true;

            const nameEl = document.getElementById('fruit-name');
            nameEl.classList.add('changing');

            const startRotY = toothGroup.rotation.y;
            const startTime = Date.now();

            function shrink() {
                const t = Math.min((Date.now() - startTime) / 350, 1);
                const ease = t * t;
                toothGroup.scale.setScalar(1 - ease * 0.4);
                toothGroup.rotation.y = startRotY + ease * Math.PI;

                if (t < 1) {
                    requestAnimationFrame(shrink);
                } else {
                    currentFruitIndex = (currentFruitIndex + 1) % fruits.length;
                    createMolarTooth(fruits[currentFruitIndex]);

                    nameEl.textContent = fruits[currentFruitIndex].name;
                    setTimeout(() => nameEl.classList.remove('changing'), 50);

                    toothGroup.scale.setScalar(0.6);
                    toothGroup.rotation.y = -Math.PI * 0.5;
                    const growStart = Date.now();

                    function grow() {
                        const gt = Math.min((Date.now() - growStart) / 450, 1);
                        const c1 = 1.70158, c3 = c1 + 1;
                        const easeBack = 1 + c3 * Math.pow(gt - 1, 3) + c1 * Math.pow(gt - 1, 2);

                        toothGroup.scale.setScalar(0.6 + easeBack * 0.4);
                        toothGroup.rotation.y = -Math.PI * 0.5 * (1 - easeBack);

                        if (gt < 1) {
                            requestAnimationFrame(grow);
                        } else {
                            toothGroup.scale.setScalar(1);
                            toothGroup.rotation.y = 0;
                            isAnimating = false;
                        }
                    }
                    requestAnimationFrame(grow);
                }
            }
            requestAnimationFrame(shrink);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (toothGroup && !isAnimating) {
                toothGroup.rotation.y += 0.002;
                toothGroup.position.y = -0.2 + Math.sin(Date.now() * 0.0008) * 0.05;
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupMouseTracking() {
            renderer.domElement.addEventListener('mousedown', (e) => {
                mouseDownTime = Date.now();
                mouseDownPos = { x: e.clientX, y: e.clientY };
            });
        }

        init();
        setupMouseTracking();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어금니 과일 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            cursor: pointer;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #info {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
            pointer-events: none;
        }

        #fruit-name {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.4s, transform 0.4s;
        }

        #fruit-name.changing {
            opacity: 0;
            transform: translateX(-50%) translateY(-10px);
        }

        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 9999;
            padding: 8px 14px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.8rem;
            font-family: monospace;
            text-decoration: none;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <a href="../bridge.html" class="back-btn">← 목록</a>
    <div id="canvas-container"></div>
    <div id="fruit-name">🍓 딸기</div>
    <div id="info">클릭하면 과일이 바뀝니다</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 과일 데이터
        const fruits = [
            {
                name: '🍓 딸기',
                color: 0xcc1133,
                roughness: 0.4,
                metalness: 0.0,
                clearcoat: 0.3
            },
            {
                name: '🍉 수박',
                color: 0x2d7a2d,
                roughness: 0.5,
                metalness: 0.0,
                clearcoat: 0.2
            },
            {
                name: '🥝 키위',
                color: 0x5c3d1e,
                roughness: 0.8,
                metalness: 0.0,
                clearcoat: 0.1
            },
            {
                name: '🍊 오렌지',
                color: 0xff7700,
                roughness: 0.5,
                metalness: 0.0,
                clearcoat: 0.4
            },
            {
                name: '🍇 포도',
                color: 0x3d0055,
                roughness: 0.2,
                metalness: 0.1,
                clearcoat: 0.6
            }
        ];

        let currentFruitIndex = 0;
        let scene, camera, renderer, controls;
        let toothModel = null;
        let isAnimating = false;
        let mouseDownTime = 0;
        let mouseDownPos = { x: 0, y: 0 };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // OrbitControls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.minDistance = 2;
            controls.maxDistance = 10;

            // 조명
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
            keyLight.position.set(4, 6, 5);
            keyLight.castShadow = true;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x8899ff, 0.4);
            fillLight.position.set(-4, 2, 3);
            scene.add(fillLight);

            const backLight = new THREE.DirectionalLight(0xffeedd, 0.6);
            backLight.position.set(0, -2, -5);
            scene.add(backLight);

            const topLight = new THREE.PointLight(0xffffff, 0.4, 10);
            topLight.position.set(0, 5, 0);
            scene.add(topLight);

            // GLB 모델 로드
            loadToothModel();

            // 이벤트
            renderer.domElement.addEventListener('mousedown', (e) => {
                mouseDownTime = Date.now();
                mouseDownPos = { x: e.clientX, y: e.clientY };
            });
            renderer.domElement.addEventListener('click', onClickHandler);
            window.addEventListener('resize', onResize);

            animate();
        }

        function loadToothModel() {
            const loader = new GLTFLoader();
            loader.load('./Untitled.glb', (gltf) => {
                toothModel = gltf.scene;

                // 모델 크기/위치 자동 조정
                const box = new THREE.Box3().setFromObject(toothModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2.5 / maxDim;
                toothModel.scale.setScalar(scale);

                // 중앙 정렬
                toothModel.position.x = -center.x * scale;
                toothModel.position.y = -center.y * scale;
                toothModel.position.z = -center.z * scale;

                // 첫 번째 과일 색상 적용
                applyFruitMaterial(fruits[currentFruitIndex]);

                // 그림자 활성화
                toothModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(toothModel);
            }, undefined, (error) => {
                console.error('GLB 로드 에러:', error);
            });
        }

        function applyFruitMaterial(fruit) {
            if (!toothModel) return;

            toothModel.traverse((child) => {
                if (child.isMesh) {
                    child.material = new THREE.MeshPhysicalMaterial({
                        color: fruit.color,
                        roughness: fruit.roughness,
                        metalness: fruit.metalness,
                        clearcoat: fruit.clearcoat,
                        clearcoatRoughness: 0.3,
                        side: THREE.DoubleSide
                    });
                }
            });
        }

        function onClickHandler(e) {
            const timeDiff = Date.now() - mouseDownTime;
            const posDiff = Math.abs(e.clientX - mouseDownPos.x) + Math.abs(e.clientY - mouseDownPos.y);

            if (timeDiff < 300 && posDiff < 10) {
                changeFruit();
            }
        }

        function changeFruit() {
            if (isAnimating || !toothModel) return;
            isAnimating = true;

            const nameEl = document.getElementById('fruit-name');
            nameEl.classList.add('changing');

            const startRotY = toothModel.rotation.y;
            const startTime = Date.now();
            const duration = 350;

            function shrink() {
                const elapsed = Date.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const ease = t * t;

                const s = toothModel.scale.x;
                const baseScale = 2.5 / getModelMaxDim();
                toothModel.scale.setScalar(baseScale * (1 - ease * 0.3));
                toothModel.rotation.y = startRotY + ease * Math.PI;

                if (t < 1) {
                    requestAnimationFrame(shrink);
                } else {
                    currentFruitIndex = (currentFruitIndex + 1) % fruits.length;
                    applyFruitMaterial(fruits[currentFruitIndex]);

                    nameEl.textContent = fruits[currentFruitIndex].name;
                    setTimeout(() => nameEl.classList.remove('changing'), 50);

                    const baseScale2 = 2.5 / getModelMaxDim();
                    toothModel.scale.setScalar(baseScale2 * 0.7);
                    toothModel.rotation.y = -Math.PI * 0.5;
                    const growStart = Date.now();

                    function grow() {
                        const ge = Date.now() - growStart;
                        const gt = Math.min(ge / 450, 1);
                        const c1 = 1.70158;
                        const c3 = c1 + 1;
                        const easeBack = 1 + c3 * Math.pow(gt - 1, 3) + c1 * Math.pow(gt - 1, 2);

                        toothModel.scale.setScalar(baseScale2 * (0.7 + easeBack * 0.3));
                        toothModel.rotation.y = -Math.PI * 0.5 * (1 - easeBack);

                        if (gt < 1) {
                            requestAnimationFrame(grow);
                        } else {
                            toothModel.scale.setScalar(baseScale2);
                            toothModel.rotation.y = 0;
                            isAnimating = false;
                        }
                    }
                    requestAnimationFrame(grow);
                }
            }
            requestAnimationFrame(shrink);
        }

        function getModelMaxDim() {
            if (!toothModel) return 1;
            // 임시로 스케일을 1로 해서 원본 크기 측정
            const currentScale = toothModel.scale.x;
            toothModel.scale.setScalar(1);
            const box = new THREE.Box3().setFromObject(toothModel);
            const size = box.getSize(new THREE.Vector3());
            toothModel.scale.setScalar(currentScale);
            return Math.max(size.x, size.y, size.z);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (toothModel && !isAnimating) {
                toothModel.rotation.y += 0.003;
                toothModel.position.y = Math.sin(Date.now() * 0.0008) * 0.05;
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>

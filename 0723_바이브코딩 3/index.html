<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어금니 과일 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            cursor: pointer;
        }

        #canvas-container { width: 100vw; height: 100vh; }

        #info {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
            pointer-events: none;
        }

        #fruit-name {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.4s, transform 0.4s;
        }

        #fruit-name.changing {
            opacity: 0;
            transform: translateX(-50%) translateY(-10px);
        }

        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 9999;
            padding: 8px 14px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.8rem;
            font-family: monospace;
            text-decoration: none;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
        }

        .back-btn:hover { background: rgba(255,255,255,0.2); }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
        }

        #loading.hidden { display: none; }
    </style>
</head>
<body>
    <a href="../bridge.html" class="back-btn">← 목록</a>
    <div id="canvas-container"></div>
    <div id="fruit-name">🍓 딸기</div>
    <div id="info">클릭하면 과일이 바뀝니다</div>
    <div id="loading">로딩 중...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        var fruits = [
            { name: '🍓 딸기', color: 0xcc1133, roughness: 0.4, metalness: 0.0, clearcoat: 0.3 },
            { name: '🍉 수박', color: 0x2d7a2d, roughness: 0.5, metalness: 0.0, clearcoat: 0.2 },
            { name: '🥝 키위', color: 0x5c3d1e, roughness: 0.8, metalness: 0.0, clearcoat: 0.1 },
            { name: '🍊 오렌지', color: 0xff7700, roughness: 0.5, metalness: 0.0, clearcoat: 0.4 },
            { name: '🍇 포도', color: 0x3d0055, roughness: 0.2, metalness: 0.1, clearcoat: 0.6 }
        ];

        var currentFruitIndex = 0;
        var scene, camera, renderer, controls;
        var toothModel = null;
        var isAnimating = false;
        var mouseDownTime = 0;
        var mouseDownPos = { x: 0, y: 0 };
        var baseScale = 1;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 2;
            controls.maxDistance = 10;

            // 조명
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            var keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
            keyLight.position.set(4, 6, 5);
            scene.add(keyLight);

            var fillLight = new THREE.DirectionalLight(0x8899ff, 0.4);
            fillLight.position.set(-4, 2, 3);
            scene.add(fillLight);

            var backLight = new THREE.DirectionalLight(0xffeedd, 0.6);
            backLight.position.set(0, -2, -5);
            scene.add(backLight);

            var topLight = new THREE.PointLight(0xffffff, 0.4, 10);
            topLight.position.set(0, 5, 0);
            scene.add(topLight);

            // GLB 로드
            var loader = new THREE.GLTFLoader();
            loader.load(
                './Untitled.glb',
                function(gltf) {
                    toothModel = gltf.scene;

                    var box = new THREE.Box3().setFromObject(toothModel);
                    var size = box.getSize(new THREE.Vector3());
                    var center = box.getCenter(new THREE.Vector3());
                    var maxDim = Math.max(size.x, size.y, size.z);
                    baseScale = 2.5 / maxDim;

                    toothModel.scale.setScalar(baseScale);
                    toothModel.position.set(
                        -center.x * baseScale,
                        -center.y * baseScale,
                        -center.z * baseScale
                    );

                    applyFruitMaterial(fruits[currentFruitIndex]);

                    toothModel.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    scene.add(toothModel);
                    document.getElementById('loading').classList.add('hidden');
                },
                function(progress) {
                    if (progress.total > 0) {
                        var pct = Math.round((progress.loaded / progress.total) * 100);
                        document.getElementById('loading').textContent = '로딩 중... ' + pct + '%';
                    }
                },
                function(error) {
                    console.error('GLB 로드 에러:', error);
                    document.getElementById('loading').textContent = 'GLB 로드 실패: ' + error.message;
                }
            );

            // 이벤트
            renderer.domElement.addEventListener('mousedown', function(e) {
                mouseDownTime = Date.now();
                mouseDownPos = { x: e.clientX, y: e.clientY };
            });
            renderer.domElement.addEventListener('click', onClickHandler);
            window.addEventListener('resize', onResize);

            animate();
        }

        function applyFruitMaterial(fruit) {
            if (!toothModel) return;
            toothModel.traverse(function(child) {
                if (child.isMesh) {
                    child.material = new THREE.MeshPhysicalMaterial({
                        color: fruit.color,
                        roughness: fruit.roughness,
                        metalness: fruit.metalness,
                        clearcoat: fruit.clearcoat,
                        clearcoatRoughness: 0.3,
                        side: THREE.DoubleSide
                    });
                }
            });
        }

        function onClickHandler(e) {
            var timeDiff = Date.now() - mouseDownTime;
            var posDiff = Math.abs(e.clientX - mouseDownPos.x) + Math.abs(e.clientY - mouseDownPos.y);
            if (timeDiff < 300 && posDiff < 10) changeFruit();
        }

        function changeFruit() {
            if (isAnimating || !toothModel) return;
            isAnimating = true;

            var nameEl = document.getElementById('fruit-name');
            nameEl.classList.add('changing');

            var startRotY = toothModel.rotation.y;
            var startTime = Date.now();

            function shrink() {
                var t = Math.min((Date.now() - startTime) / 350, 1);
                var ease = t * t;

                toothModel.scale.setScalar(baseScale * (1 - ease * 0.3));
                toothModel.rotation.y = startRotY + ease * Math.PI;

                if (t < 1) {
                    requestAnimationFrame(shrink);
                } else {
                    currentFruitIndex = (currentFruitIndex + 1) % fruits.length;
                    applyFruitMaterial(fruits[currentFruitIndex]);
                    nameEl.textContent = fruits[currentFruitIndex].name;
                    setTimeout(function() { nameEl.classList.remove('changing'); }, 50);

                    toothModel.scale.setScalar(baseScale * 0.7);
                    toothModel.rotation.y = -Math.PI * 0.5;
                    var growStart = Date.now();

                    function grow() {
                        var gt = Math.min((Date.now() - growStart) / 450, 1);
                        var c1 = 1.70158, c3 = c1 + 1;
                        var easeBack = 1 + c3 * Math.pow(gt - 1, 3) + c1 * Math.pow(gt - 1, 2);

                        toothModel.scale.setScalar(baseScale * (0.7 + easeBack * 0.3));
                        toothModel.rotation.y = -Math.PI * 0.5 * (1 - easeBack);

                        if (gt < 1) {
                            requestAnimationFrame(grow);
                        } else {
                            toothModel.scale.setScalar(baseScale);
                            toothModel.rotation.y = 0;
                            isAnimating = false;
                        }
                    }
                    requestAnimationFrame(grow);
                }
            }
            requestAnimationFrame(shrink);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (toothModel && !isAnimating) {
                toothModel.rotation.y += 0.003;
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>

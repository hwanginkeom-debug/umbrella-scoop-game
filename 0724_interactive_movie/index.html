<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비상</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:100vh;cursor:pointer}
        #game-container{position:relative;background:#0a0a14;overflow:hidden;transition:width 1.2s ease,height 1.2s ease;border:1px solid #222}
        canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
        #narration{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#eee;font-size:12px;font-family:monospace;text-align:center;max-width:85%;display:none;z-index:100;letter-spacing:0.5px}
        #narration.show{display:block}
        #ending-btns{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);display:none;gap:20px;z-index:300}
        #ending-btns.show{display:flex}
        #ending-btns button{font-family:monospace;font-size:11px;padding:10px 22px;background:#000;color:#fff;border:1px solid #555;cursor:pointer}
        #ending-btns button:hover{background:#fff;color:#000}
        #fullscreen-replay{position:fixed;inset:0;background:#000;display:none;flex-wrap:wrap;align-content:center;justify-content:center;z-index:9999;cursor:pointer;padding:20px;gap:10px;overflow:hidden}
        #fullscreen-replay.show{display:flex}
        #fullscreen-replay button{font-family:monospace;font-size:11px;padding:8px 18px;background:#000;color:#fff;border:1px solid #555;cursor:pointer;transition:opacity .3s}
        #fullscreen-replay button:hover{background:#fff;color:#000}
        .back-btn{position:fixed;top:8px;left:8px;z-index:10000;padding:4px 10px;background:transparent;color:#444;font-size:9px;font-family:monospace;text-decoration:none}
        .back-btn:hover{color:#aaa}
    </style>
</head>
<body>
<a href="../bridge.html" class="back-btn">← BACK</a>
<div id="game-container">
    <canvas id="canvas"></canvas>
    <div id="narration"></div>
    <div id="ending-btns">
        <button id="btn-replay">다시보기</button>
        <button id="btn-exit">나가기</button>
    </div>
</div>
<div id="fullscreen-replay"></div>

<script src="./sprites.js"></script>
<script>
// ===================== AUDIO =====================
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new AudioCtx();}
function playAlarm(){initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='square';g.gain.value=.06;o.start();let c=0;const iv=setInterval(()=>{o.frequency.value=c%2?550:440;c++;if(c>8){clearInterval(iv);g.gain.value=0;o.stop();}},120);}
function playSiren(){initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sawtooth';g.gain.value=.05;o.start();let t=0;const iv=setInterval(()=>{o.frequency.value=280+Math.sin(t*3)*180;t+=.04;},25);setTimeout(()=>{clearInterval(iv);g.gain.value=0;o.stop();},2200);}
function playClap(){initAudio();const b=audioCtx.createBuffer(1,audioCtx.sampleRate*.06,audioCtx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5);const s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=b;s.connect(g);g.connect(audioCtx.destination);g.gain.value=.15;s.start();}

// 배경 앰비언스
let bgmNode=null,bgmGain=null;
function stopBgm(){if(bgmNode){try{bgmNode.stop();}catch(e){}bgmNode=null;}}
function playBgm(type){
    initAudio();stopBgm();
    bgmGain=audioCtx.createGain();bgmGain.connect(audioCtx.destination);bgmGain.gain.value=0.04;
    if(type==='morning'){
        // 부드러운 톤 (일상)
        const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=220;o.connect(bgmGain);o.start();bgmNode=o;
    }else if(type==='peace'){
        // 평화로운 패드 (비상 중)
        const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=330;
        const o2=audioCtx.createOscillator();o2.type='sine';o2.frequency.value=440;
        const g2=audioCtx.createGain();g2.gain.value=0.02;
        o.connect(bgmGain);o2.connect(g2);g2.connect(audioCtx.destination);
        o.start();o2.start();bgmNode=o;
        // o2는 별도 관리 (간단하게)
    }else if(type==='tension'){
        // 긴장 드론
        const o=audioCtx.createOscillator();o.type='sawtooth';o.frequency.value=55;bgmGain.gain.value=0.03;o.connect(bgmGain);o.start();bgmNode=o;
    }else{
        stopBgm();
    }
}

// ===================== CANVAS =====================
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const container=document.getElementById('game-container');
const narrationEl=document.getElementById('narration');
let W=320,H=180;

function setAspect(ratio){
    const maxW=Math.min(window.innerWidth*.92,820);
    const maxH=window.innerHeight*.88;
    let w,h;
    if(ratio==='16:9'){w=maxW;h=w*(9/16);if(h>maxH){h=maxH;w=h*(16/9);}W=320;H=180;}
    else if(ratio==='4:3'){w=maxW;h=w*(3/4);if(h>maxH){h=maxH;w=h*(4/3);}W=256;H=192;}
    else{const s=Math.min(maxW,maxH);w=s;h=s;W=200;H=200;}
    container.style.width=w+'px';container.style.height=h+'px';
    canvas.width=W;canvas.height=H;
}

function px(x,y,w,h,c){ctx.fillStyle=c||'#fff';ctx.fillRect(Math.floor(x),Math.floor(y),w||1,h||1);}
function txt(str,x,y,sz,c){ctx.fillStyle=c||'#fff';ctx.font='bold '+(sz||8)+'px monospace';ctx.textAlign='center';ctx.fillText(str,x,y);}

// ===================== COLORS =====================
const C={skin:'#e8b87a',skinDark:'#c89058',hair:'#3a2211',hairLight:'#5a3a22',shirt:'#3377cc',shirtLight:'#5599ee',shirtDark:'#225588',pants:'#2a3355',pantsDark:'#1a2244',grass:'#1a5522',grassLight:'#2a7733',grassDark:'#0d3a15',tree:'#5a3a1a',treeLight:'#7a5a2a',leaf:'#1a8822',leafLight:'#33aa44',leafDark:'#0d6618',flower1:'#ee5588',flower2:'#ffaa33',flower3:'#aa55ee',flower4:'#55ccff',sun:'#ffdd44',sunGlow:'#ffee88',cloud:'#667788',cloudLight:'#8899aa',blood:'#aa1122',bloodDark:'#661111',wood:'#6a4422',woodDark:'#4a2a11',windowLit:'#ffeeaa'};

// ===================== DRAW HELPERS =====================
function drawManDetailed(x,y,opts={}){
    const{lying,arms,running,bread}=opts;
    if(lying){px(x-10,y,20,3,C.shirt);px(x-10,y+3,20,2,C.shirtDark);px(x+10,y-2,5,5,C.skin);px(x+10,y-4,5,3,C.hair);px(x-12,y+2,4,2,C.pants);return;}
    px(x-2,y-18,5,4,C.hair);px(x-3,y-16,1,2,C.hair);px(x+3,y-16,1,2,C.hair);
    px(x-2,y-14,5,5,C.skin);px(x-1,y-12,1,1,'#222');px(x+1,y-12,1,1,'#222');
    px(x-2,y-9,5,7,C.shirt);px(x-2,y-9,5,1,C.shirtLight);px(x-2,y-3,5,1,C.shirtDark);
    if(arms==='spread'){px(x-5,y-8,3,2,C.shirt);px(x+3,y-8,3,2,C.shirt);px(x-6,y-8,1,2,C.skin);px(x+5,y-8,1,2,C.skin);}
    else if(arms==='up'){px(x-3,y-14,1,6,C.shirt);px(x+3,y-14,1,6,C.shirt);px(x-3,y-15,1,1,C.skin);px(x+3,y-15,1,1,C.skin);}
    else{px(x-3,y-8,1,5,C.shirt);px(x+3,y-8,1,5,C.shirt);px(x-3,y-3,1,2,C.skin);px(x+3,y-3,1,2,C.skin);}
    px(x-2,y-2,2,5,C.pants);px(x+1,y-2,2,5,C.pants);
    if(bread){px(x+3,y-12,4,3,'#dda044');}
    if(running){px(x-3,y,2,2,C.pants);px(x+2,y-1,2,2,C.pants);}
}

function drawFaceCloseup(cx,cy,opts={}){
    const{smile,sparkle,t}=opts;
    const s=Math.min(W,H)*.25;
    for(let dy=-s;dy<=s;dy++){const rw=Math.sqrt(s*s-dy*dy)*1.1;px(cx-rw,cy+dy,rw*2,1,C.skin);}
    for(let dy=-s;dy<-s*.4;dy++){const rw=Math.sqrt(s*s-dy*dy)*1.15;px(cx-rw,cy+dy,rw*2,1,C.hair);}
    px(cx-s*.8,cy-s*.3,s*.2,s*.4,C.hair);px(cx+s*.6,cy-s*.3,s*.2,s*.4,C.hair);
    const es=s*.18;
    px(cx-s*.3-es,cy-s*.1,es*2,es*1.6,'#fff');px(cx+s*.3-es,cy-s*.1,es*2,es*1.6,'#fff');
    px(cx-s*.3-es*.4,cy-s*.05,es*.8,es,'#224');px(cx+s*.3-es*.4,cy-s*.05,es*.8,es,'#224');
    px(cx-s*.3-es*.2,cy-s*.1,es*.3,es*.3,'#fff');px(cx+s*.3-es*.2,cy-s*.1,es*.3,es*.3,'#fff');
    if(smile){const mw=s*.4;px(cx-mw/2,cy+s*.4,mw,s*.08,'#c44');px(cx-mw/2-1,cy+s*.38,2,2,'#c44');px(cx+mw/2-1,cy+s*.38,2,2,'#c44');}
    if(sparkle&&t){[[-s*.8,-s*.5],[s*.7,-s*.7],[-s*.6,s*.3],[s*.8,s*.2]].forEach(([sx,sy],i)=>{if((t+i*8)%24<12){px(cx+sx,cy+sy,2,2,C.sun);px(cx+sx-2,cy+sy,6,1,C.sun);px(cx+sx,cy+sy-2,1,6,C.sun);}});}
}

function drawFlowerDetailed(x,y,c){px(x,y,1,6,'#2a6622');px(x-1,y+3,1,1,'#3a8833');px(x+1,y+2,1,1,'#3a8833');px(x-1,y-2,3,1,c||C.flower1);px(x,y-3,1,1,c||C.flower1);px(x-2,y-1,1,1,c||C.flower1);px(x+2,y-1,1,1,c||C.flower1);px(x,y,1,1,C.sun);}
function drawButterflyDetailed(x,y,t,c){const cl=c||C.flower1;px(x,y,1,2,'#333');if(Math.floor(t/5)%2){px(x-3,y-1,3,2,cl);px(x+1,y-1,3,2,cl);}else{px(x-2,y,2,1,cl);px(x+1,y,2,1,cl);}}
function drawTreeDetailed(x,y,s){const sz=s||1;px(x-1*sz,y-16*sz,3*sz,16*sz,C.tree);px(x,y-16*sz,1*sz,16*sz,C.treeLight);for(let l=0;l<3;l++){const ly=y-16*sz+2*sz+l*4*sz;const lw=(7-l*1.5)*sz;for(let dy=0;dy<4*sz;dy++){const rw=lw*(1-dy/(4*sz))*1.2;px(x-rw/2,ly+dy,rw,1,dy%2?C.leaf:C.leafLight);}}}

// ===================== CAMERA OVERLAY =====================
function drawCameraOverlay(t){
    const m=6,l=14;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.moveTo(m,m+l);ctx.lineTo(m,m);ctx.lineTo(m+l,m);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W-m-l,m);ctx.lineTo(W-m,m);ctx.lineTo(W-m,m+l);ctx.stroke();
    ctx.beginPath();ctx.moveTo(m,H-m-l);ctx.lineTo(m,H-m);ctx.lineTo(m+l,H-m);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W-m-l,H-m);ctx.lineTo(W-m,H-m);ctx.lineTo(W-m,H-m-l);ctx.stroke();
    const cx2=W/2,cy2=H/2;px(cx2-4,cy2,3,1,'#fff');px(cx2+2,cy2,3,1,'#fff');px(cx2,cy2-4,1,3,'#fff');px(cx2,cy2+2,1,3,'#fff');
    if(Math.floor(t/20)%2){px(W-28,10,4,4,'#cc0000');txt('REC',W-14,14,5,'#cc0000');}
    ctx.globalAlpha=1;
}

// ===================== SHOTS =====================
let currentShot=0,animTime=0,lastClickTime=Date.now(),easterEggShown=false;
const shots=[
    {a:'16:9',draw:s1_wake,bgm:'morning'},
    {a:'16:9',draw:s2_alarm,snd:'alarm'},
    {a:'16:9',draw:s3_ohno,nar:'"조졌네…"'},
    {a:'16:9',draw:s4_late,nar:'남자는 지각을 했습니다'},
    {a:'16:9',draw:s5_run},
    {a:'16:9',draw:s6_hall},
    {a:'16:9',draw:s7_eyes},
    {a:'16:9',draw:s_trans1,auto:true},
    {a:'4:3',draw:s9_window,bgm:'peace'},
    {a:'4:3',draw:s10_sky},
    {a:'4:3',draw:s11_neighbors},
    {a:'4:3',draw:s12_ground},
    {a:'4:3',draw:s_trans2,snd:'siren',bgm:'tension'},
    {a:'1:1',draw:s13_fallen},
    {a:'1:1',draw:s14_crowd},
    {a:'1:1',draw:s15_smile},
    {a:'1:1',draw:s16_iris,auto:true},
    {a:'1:1',draw:s17_credits,bgm:null},
    {a:'1:1',draw:s18_audience,snd:'clap'},
];

// ===================== PART 1 (16:9) =====================
function s1_wake(t){
    ctx.fillStyle='#0a0a18';ctx.fillRect(0,0,W,H);
    px(0,H*.4,W,1,'#1a1a2a');for(let i=0;i<W;i+=8)px(i,H*.7,5,1,'#1a1a2a');
    px(0,H*.65,W,H*.35,'#2a3355');px(0,H*.65,W,2,'#3a4466');
    const open=Math.min(t/50,1),bar=Math.floor(H*.45*(1-open));
    px(0,0,W,bar,'#000');px(0,H-bar,W,bar,'#000');
    drawCameraOverlay(t);
}
function s2_alarm(t){
    ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
    const cx=W/2,cy=H/2;
    px(cx-14,cy-22,28,44,'#1a1a1a');px(cx-12,cy-20,24,40,'#111');px(cx-11,cy-19,22,38,'#0a0a0a');
    const blink=Math.floor(t/8)%2;
    txt('8:47',cx,cy+4,14,blink?'#ff4444':'#661111');
    txt('ALARM',cx,cy+18,7,'#aa3333');
    if(Math.floor(t/3)%2)ctx.translate(.5,0);
    drawCameraOverlay(t);
}
function s3_ohno(t){
    ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
    drawManDetailed(W/2,H/2+10);
    if(t>8){px(W/2+6,H/2-6,2,4,'#88ccff');}
    drawCameraOverlay(t);
}
function s4_late(t){ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);drawCameraOverlay(t);}
function s5_run(t){
    ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
    for(let i=0;i<5;i++)drawSprite(SPRITE_BUILDING,i*65,H-10-35,1);
    px(0,H-10,W,10,'#0d0d14');px(0,H-10,W,1,'#333');
    const rx=60+(t*.5)%50,bob=Math.floor(t/4)%2;
    drawSprite(SPRITE_MAN_RUN,rx,H-40-bob,1.5);
    drawCameraOverlay(t);
}
function s6_hall(t){
    ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
    px(0,H*.2,W,2,'#2a2a3a');px(0,H*.8,W,2,'#2a2a3a');
    for(let i=0;i<20;i++)px(i*16+8,H*.2,2,H*.6,'#151520');
    px(0,H*.65,W,2,'#333');
    const wx=30+(t*.5)%(W-60);drawManDetailed(wx,H*.6);
    drawCameraOverlay(t);
}
function s7_eyes(t){
    ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
    drawFaceCloseup(W/2,H/2,{sparkle:true,t:t});
    drawCameraOverlay(t);
}
function s_trans1(t){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(t>40)nextShot();}

// ===================== PART 2 (4:3 가로) =====================
function s9_window(t){
    for(let i=0;i<H;i++){px(0,i,W,1,`rgb(${Math.floor(10+i*.08)},${Math.floor(22+i*.12)},${Math.floor(40+i*.18)})`);}
    drawSprite(SPRITE_SUN,W-60,20,2);
    drawSprite(SPRITE_CLOUD,20+(t*.08)%100,25,2);drawSprite(SPRITE_CLOUD,120+(t*.06)%80,45,1.5);drawSprite(SPRITE_CLOUD,200+(t*.07)%70,30,1.8);
    for(let i=0;i<W;i++){const mh=20+Math.sin(i*.015)*12+Math.sin(i*.04)*6;px(i,H*.55-mh+80,1,mh,'#1a3a2a');}
    drawSprite(SPRITE_TREE,25,H*.72-28,1.2);drawSprite(SPRITE_TREE,80,H*.74-28,1);drawSprite(SPRITE_TREE,150,H*.71-28,1.3);drawSprite(SPRITE_TREE,210,H*.73-28,1.1);
    px(0,H*.74,W,H*.26,C.grass);for(let i=0;i<W;i+=2){px(i,H*.74-1-Math.random()*3,1,1+Math.random()*3,Math.random()>.5?C.grassLight:C.grass);}
    for(let i=0;i<6;i++){const bx=25+i*40+Math.sin(t*.02+i)*12,by=40+Math.sin(t*.015+i*1.5)*15;drawSprite(Math.floor(t/6+i)%2?SPRITE_BIRD_1:SPRITE_BIRD_2,bx,by,1.5);}
    px(0,0,W,8,C.wood);px(0,H-8,W,8,C.wood);px(0,0,8,H,C.wood);px(W-8,0,8,H,C.wood);px(W/2-2,0,4,H,C.wood);px(0,H/2-2,W,4,C.wood);
    drawCameraOverlay(t);
}
function s10_sky(t){

JkKAxRZcM9yZCgIossh7lMp7vqQgKK5T3fUgae76kGCIssh7vqThlAYoVlwynDPd9SAxRZZD3fUgYe5AYqrLhnuUyHuQGKLLIe5OGe5AYosuGU4Z7kBiiyyHuTIUBiiyyFMh7kJMUWfDPd9SnDPchBijv7lnwz3fUo+M25fUoJP/2Q==';
        window._birdRef.img.onload=()=>{
            const oc=document.createElement('canvas');
            const iw=window._birdRef.img.naturalWidth,ih=window._birdRef.img.naturalHeight;
            oc.width=iw;oc.height=ih;
            const octx=oc.getContext('2d');
            octx.drawImage(window._birdRef.img,0,0);
            const raw=octx.getImageData(0,0,iw,ih);
            const bCols=Math.floor(W/2), bRows=Math.floor(H/2);
            const bw=iw/bCols, bh=ih/bRows;
            const pal=[[26,26,46],[192,133,88],[204,51,51],[221,136,34],[221,204,51],[68,136,204],[102,136,170],[119,136,153],[255,255,255],[40,40,60]];
            const blocks=new Array(bRows*bCols);
            for(let by=0;by<bRows;by++){
                for(let bx=0;bx<bCols;bx++){
                    const votes=new Array(pal.length).fill(0);
                    const sx=Math.floor(bx*bw),sy=Math.floor(by*bh);
                    const ex=Math.min(Math.floor((bx+1)*bw),iw),ey=Math.min(Math.floor((by+1)*bh),ih);
                    for(let y=sy;y<ey;y++){
                        for(let x=sx;x<ex;x++){
                            const idx=(y*iw+x)*4;
                            const r=raw.data[idx],g=raw.data[idx+1],b2=raw.data[idx+2];
                            let minD=Infinity,best=0;
                            for(let p=0;p<pal.length;p++){
                                const d=(r-pal[p][0])**2+(g-pal[p][1])**2+(b2-pal[p][2])**2;
                                if(d<minD){minD=d;best=p;}
                            }
                            votes[best]++;
                        }
                    }
                    let maxV=0,winner=0;
                    for(let p=0;p<pal.length;p++){if(votes[p]>maxV){maxV=votes[p];winner=p;}}
                    blocks[by*bCols+bx]=winner;
                }
            }
            window._birdRef.blocks=blocks;
            window._birdRef.bCols=bCols;
            window._birdRef.bRows=bRows;
            window._birdRef.pal=pal;
            window._birdRef.loaded=true;
        };
    }
    if(window._birdRef.loaded){
        const{blocks,bCols,bRows,pal}=window._birdRef;
        for(let by=0;by<bRows;by++){
            // 계단식 좌우 모션: 각 행마다 위상이 다르게 좌우로 흔들렸다 돌아옴
            const rowOffset=Math.sin(t*.02+by*.15)*Math.sin(t*.008)*3;
            for(let bx=0;bx<bCols;bx++){
                const ci=blocks[by*bCols+bx];
                const c=pal[ci];
                ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
                ctx.fillRect(Math.floor(bx*2+rowOffset),by*2,2,2);
            }
        }
    }else{
        ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
        txt('LOADING...',W/2,H/2,8,'#556');
    }
    drawCameraOverlay(t);
}
function s11_neighbors(t){
    ctx.fillStyle='#2a2832';ctx.fillRect(0,0,W,H);
    for(let i=0;i<W;i+=12)px(i,0,1,H,'#252330');for(let i=0;i<H;i+=10)px(0,i,W,1,'#252330');
    for(let row=0;row<4;row++){for(let col=0;col<4;col++){const wx=18+col*58,wy=12+row*44;px(wx,wy,36,30,'#1a1820');px(wx+2,wy+2,32,26,'#332a1a');if((row*4+col)%2===0){drawManDetailed(wx+18,wy+22);px(wx+24,wy+8-(Math.floor(t/10+row+col)%2)*3,3,2,C.skin);}}}
    drawManDetailed(W/2+40,15+(t*.5)%(H*.6),{arms:'spread'});
    drawCameraOverlay(t);
}
function s12_ground(t){
    for(let i=0;i<H*.3;i++){px(0,i,W,1,`rgb(${Math.floor(14+i*.1)},${Math.floor(28+i*.13)},${Math.floor(48+i*.18)})`);}
    px(0,H*.3,W,H*.7,C.grass);for(let i=0;i<W;i+=2){px(i,H*.3-2-Math.random()*4,1,2+Math.random()*4,Math.random()>.5?C.grassLight:C.grass);}
    const fc=[C.flower1,C.flower2,C.flower3,C.flower4,'#ffaacc'];
    for(let i=0;i<20;i++)drawFlowerDetailed(10+i*12,H*.36+(i%5)*14,fc[i%5]);
    drawTreeDetailed(15,H*.32,1.5);drawTreeDetailed(W-20,H*.33,1.3);drawTreeDetailed(W/2-10,H*.3,1.7);
    for(let i=0;i<7;i++){drawButterflyDetailed(20+i*35+Math.sin(t*.016+i)*10,H*.2+Math.cos(t*.014+i*.6)*14,t+i*5,fc[i%5]);}
    drawManDetailed(W/2,H*.25+Math.sin(t*.02)*5,{arms:'spread'});
    drawCameraOverlay(t);
}
function s_trans2(t){ctx.fillStyle=Math.floor(t/5)%2?'#2a0000':'#00002a';ctx.fillRect(0,0,W,H);if(t>55)nextShot();}

// ===================== PART 3 (1:1) =====================
function s13_fallen(t){
    ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);px(0,H*.65,W,H*.35,'#1a1a1a');px(0,H*.65,W,1,'#333');
    drawManDetailed(W/2,H*.68,{lying:true});
    const sp=Math.min(t*.2,16);px(W/2+12,H*.69,sp,3,C.blood);px(W/2+10,H*.72,sp+4,2,C.bloodDark);
    for(let i=0;i<8;i++)drawManDetailed(20+i*22,H*.48);
    drawCameraOverlay(t);
}
function s14_crowd(t){
    ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
    drawManDetailed(55,H*.55);px(62,H*.55-8,10,2,C.skin);
    px(73,H*.55-6,3,3,C.skin);px(73,H*.55-8,3,2,C.hair);px(73,H*.55-3,3,4,'#88aacc');px(73,H*.55+1,1,3,C.pants);px(75,H*.55+1,1,3,C.pants);
    drawManDetailed(145,H*.55,{arms:'up'});
    px(115,H*.2,60,20,'#fff');px(145,H*.4,3,5,'#fff');txt('집값 떨어진다!',145,H*.2+14,8,'#000');
    drawCameraOverlay(t);
}
function s15_smile(t){ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);drawFaceCloseup(W/2,H/2,{smile:true,t:t});drawCameraOverlay(t);}
function s16_iris(t){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    const cx=W/2,cy=H/2,progress=Math.min(t/90,1),r=Math.max(W,H)*.5*(1-progress);
    if(r>1){ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();drawFaceCloseup(cx,cy,{smile:true});drawCameraOverlay(t);ctx.restore();}
    if(progress>=1)setTimeout(()=>nextShot(),600);
}
function s17_credits(t){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    const lines=['감독 · 기획','','hwanginkeom','','바이브코딩 Lab','','2026','','','FIN'];
    const sy=H-t*.25;lines.forEach((l,i)=>{const ly=sy+i*20;if(ly>-10&&ly<H+10)txt(l,W/2,ly,8,'#fff');});
    drawCameraOverlay(t);
}
function s18_audience(t){
    ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
    px(W*.15,8,W*.7,H*.28,'#111');txt('FIN',W/2,H*.16+5,14,'#fff');
    for(let row=0;row<4;row++){for(let col=0;col<9;col++){const hx=10+col*21,hy=H*.48+row*18;px(hx,hy,6,6,C.skin);px(hx,hy-3,6,3,C.hair);if(Math.floor(t/4+col+row)%2===0){px(hx-2,hy+6,3,2,C.skin);px(hx+5,hy+6,3,2,C.skin);}}}
    if(t%20===0&&t>0&&t<160)playClap();
    if(t>80)document.getElementById('ending-btns').classList.add('show');
}

// ===================== UI =====================
function drawEasterEgg(){}

// ===================== LOGIC =====================
function nextShot(){
    if(currentShot<shots.length-1){currentShot++;animTime=0;const s=shots[currentShot];setAspect(s.a);
    if(s.snd==='alarm')playAlarm();if(s.snd==='siren')playSiren();if(s.snd==='clap')playClap();
    if(s.bgm!==undefined)playBgm(s.bgm);
    if(s.nar){narrationEl.textContent=s.nar;narrationEl.classList.add('show');}else narrationEl.classList.remove('show');}
}
function startGame(){currentShot=0;animTime=0;document.getElementById('ending-btns').classList.remove('show');document.getElementById('fullscreen-replay').classList.remove('show');narrationEl.classList.remove('show');setAspect(shots[0].a);}

container.addEventListener('click',function(e){if(e.target.tagName==='BUTTON')return;initAudio();if(!shots[currentShot].auto){nextShot();}});




document.getElementById('btn-replay').addEventListener('click',function(e){e.stopPropagation();startGame();});
document.getElementById('btn-exit').addEventListener('click',function(e){
    e.stopPropagation();
    document.getElementById('ending-btns').classList.remove('show');
    const el=document.getElementById('fullscreen-replay');
    el.innerHTML='';
    el.classList.add('show');
    // 버튼 1개 시작, 점점 증식
    let count=0;
    function addBtn(){
        const b=document.createElement('button');
        b.textContent='다시보기';
        b.addEventListener('click',function(ev){ev.stopPropagation();startGame();});
        el.appendChild(b);
        count++;
        if(count<80){
            const delay=Math.max(300-count*3,30);
            setTimeout(addBtn,delay);
        }
    }
    addBtn();
});
document.getElementById('fullscreen-replay').addEventListener('click',startGame);

// ===================== RENDER =====================
function render(){requestAnimationFrame(render);ctx.save();ctx.clearRect(0,0,W,H);const s=shots[currentShot];if(s&&s.draw)s.draw(animTime);drawEasterEgg();ctx.restore();animTime++;}
currentShot=9;setAspect('4:3');render();

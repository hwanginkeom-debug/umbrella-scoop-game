#fullscreen-replay{position:fixed;inset:0;background:#000;display:none;flex-wrap:wrap;align-content:center;justify-content:center;z-index:9999;cursor:pointer;padding:20px;gap:10px;overflow:hidden}
#fullscreen-replay.show{display:flex}
#fullscreen-replay button{font-family:monospace;font-size:11px;padding:8px 18px;background:#000;color:#fff;border:none;cursor:pointer}

.back-btn{position:fixed;top:8px;left:8px;z-index:10000;padding:4px 10px;background:transparent;color:#444;font-size:9px;font-family:monospace;text-decoration:none}
#credits-screen{position:fixed;inset:0;background:#000;display:none;z-index:9998;overflow:hidden}
#credits-screen.show{display:flex;align-items:flex-start;justify-content:center}

#credits-screen .credits-roll img{width:95%;max-width:700px;margin:14px auto;display:block;image-rendering:pixelated}
@keyframes rollUp{from{transform:translateY(100vh)}to{transform:translateY(-100%)}}
#start-screen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9990;cursor:pointer;gap:12px}
#start-screen p{color:#666;font-family:monospace;font-size:30px;letter-spacing:.5px}
#start-screen.hide{display:none}
.back-btn:hover{color:#aaa}
</style>

// ===== STATE =====
let cur=0,beat=0,animT=0;
let blocks=null,nextBlocks=null,trans=false,transP=0;

// ===== CANVAS =====
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const container=document.getElementById('game-container');
const narEl=document.getElementById('narration');

function resize(){
  const maxW=Math.min(window.innerWidth*.94,900),maxH=window.innerHeight*.88;
  let w=maxW,h=w*(9/16);
  if(h>maxH){h=maxH;w=h*(16/9);}
  container.style.width=w+'px';container.style.height=h+'px';
  document.getElementById('progress-wrap').style.width=w+'px';
  canvas.width=W;canvas.height=H;
}
resize();window.addEventListener('resize',resize);

// ===== AUDIO =====
const AC=window.AudioContext||window.webkitAudioContext;
let actx,bgmN=[],bgmG;
function initA(){if(!actx)actx=new AC();}
function stopBgm(immediate){bgmN.forEach(n=>{try{if(n._audio){n._audio.pause();n._audio.currentTime=0;}else if(n.kill){n.kill();}else{n.stop();}}catch(e){}});bgmN=[];}

function playBgm(type){
  initA();
  if(!type||type==='none'){
    // 즉시 정지 (암전 등)
    bgmN.forEach(n=>{try{if(n.kill)n.kill();else n.stop();}catch(e){}});
    bgmN=[];return;
  }
  stopBgm();
  bgmG=actx.createGain();bgmG.connect(actx.destination);bgmG.gain.value=.04;
  // nature_mel: 두 파일 동시 재생 (특별 처리)
  if(type==='nature_mel'){
    const a1=new Audio('assets/audio/bgm_nature.mp3');
    const a2=new Audio('assets/audio/bgm_melancholy.mp3');
    a1.loop=true;a2.loop=true;a1.volume=0;a2.volume=0;
    a1.play().catch(()=>{});a2.play().catch(()=>{});
    const mx1=0.35,mx2=0.3;
    let v1=0,v2=0;
    const fi=setInterval(()=>{
      v1+=mx1/40;v2+=mx2/40;
      if(v1>=mx1)v1=mx1;if(v2>=mx2)v2=mx2;
      a1.volume=v1;a2.volume=v2;
      if(v1>=mx1&&v2>=mx2)clearInterval(fi);
    },50);
    bgmN.push({stop:()=>{
      let vv1=a1.volume,vv2=a2.volume;
      const fo=setInterval(()=>{
        vv1-=.05;vv2-=.05;
        if(vv1<=0&&vv2<=0){clearInterval(fo);a1.pause();a2.pause();}
        a1.volume=Math.max(0,vv1);a2.volume=Math.max(0,vv2);
      },50);
    }});
    return;
  }
  // 파일 기반 재생 시도
  const audioFile='assets/audio/bgm_'+type+'.mp3';
  const testAudio=new Audio(audioFile);
  testAudio.addEventListener('canplaythrough',()=>{
    testAudio.loop=true;testAudio.volume=0;testAudio.play();
    // Fade in (2초)
    const maxVol=(type==='classic')?0.042:(type==='fresh')?0.7:0.5;
    let vol=0;
    const fadeIn=setInterval(()=>{vol+=maxVol/48;if(vol>=maxVol){vol=maxVol;clearInterval(fadeIn);}testAudio.volume=vol;},50);
    bgmN.push({_audio:testAudio,stop:()=>{
      // Fade out (1.7초)
      let v=testAudio.volume;
      const fadeOut=setInterval(()=>{v-=0.02;if(v<=0){v=0;clearInterval(fadeOut);testAudio.pause();testAudio.currentTime=0;}testAudio.volume=Math.max(0,v);},50);
    },kill:()=>{testAudio.pause();testAudio.currentTime=0;}});
  },{once:true});
  testAudio.addEventListener('error',()=>{_synthBgm(type);},{once:true});
  testAudio.load();
}
function _synthBgm(type){
  // 합성음 fallback
  if(type==='calm'){
    const o=actx.createOscillator();o.type='sine';o.frequency.value=180;
    const o2=actx.createOscillator();o2.type='sine';o2.frequency.value=270;
    const g2=actx.createGain();g2.gain.value=.02;
    o.connect(bgmG);o2.connect(g2);g2.connect(actx.destination);
    o.start();o2.start();bgmN.push(o,o2);
  }else if(type==='footsteps'){
    bgmG.gain.value=.06;let s=0;
    const iv=setInterval(()=>{
      if(!actx||!bgmN.length){clearInterval(iv);return;}
      const b=actx.createBuffer(1,actx.sampleRate*.05,actx.sampleRate);
      const d=b.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4)*(s%2?.6:.4);
      const src=actx.createBufferSource();src.buffer=b;src.connect(bgmG);src.start();s++;
    },600);
    bgmN.push({stop:()=>clearInterval(iv)});
  }else if(type==='fresh'){
    bgmG.gain.value=.035;
    const o=actx.createOscillator();o.type='sine';o.frequency.value=220;
    const lfo=actx.createOscillator();lfo.frequency.value=.15;
    const lg=actx.createGain();lg.gain.value=30;
    lfo.connect(lg);lg.connect(o.frequency);
    o.connect(bgmG);o.start();lfo.start();bgmN.push(o,lfo);
  }else if(type==='classic'){
    bgmG.gain.value=.03;
    [261.6,329.6,392,523.2].forEach(f=>{
      const o=actx.createOscillator();o.type='sine';o.frequency.value=f;
      const g=actx.createGain();g.gain.value=.015;
      o.connect(g);g.connect(actx.destination);o.start();bgmN.push(o);
    });
  }else if(type==='rain'){
    bgmG.gain.value=.05;
    const buf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.3;
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    const f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=800;
    src.connect(f);f.connect(bgmG);src.start();bgmN.push(src);
  }else if(type==='quiet'){
    bgmG.gain.value=.015;
    const o=actx.createOscillator();o.type='sine';o.frequency.value=150;
    o.connect(bgmG);o.start();bgmN.push(o);
  }else if(type==='nature'){
    bgmG.gain.value=.03;
    const buf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.15;
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=3000;f.Q.value=2;
    src.connect(f);f.connect(bgmG);src.start();bgmN.push(src);
    const o=actx.createOscillator();o.type='sine';o.frequency.value=4200;
    const g2=actx.createGain();g2.gain.value=.008;
    const lfo=actx.createOscillator();lfo.frequency.value=8;
    const lg=actx.createGain();lg.gain.value=.008;
    lfo.connect(lg);lg.connect(g2.gain);o.connect(g2);g2.connect(actx.destination);
    o.start();lfo.start();bgmN.push(o,lfo);
  }else if(type==='applause'){
    bgmG.gain.value=.05;
    const buf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.2*(1+Math.sin(i/400)*.5);
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=2000;f.Q.value=.3;
    src.connect(f);f.connect(bgmG);src.start();bgmN.push(src);
    const scale=[523,587,659,698,784,880,988,1047,1175,1318,1397,1568];
    let ni=0;
    const mIv=setInterval(()=>{
      if(!actx||!bgmN.length)return;
      const o=actx.createOscillator();o.type=ni%4<2?'square':'sawtooth';
      o.frequency.value=scale[Math.floor(Math.random()*scale.length)];
      const g=actx.createGain();g.gain.value=.025;
      g.gain.linearRampToValueAtTime(0,actx.currentTime+.1);
      o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.1);ni++;
    },110);
    bgmN.push({stop:()=>clearInterval(mIv)});
    const bass=[130.8,146.8,164.8,174.6];let bi=0;
    const bIv=setInterval(()=>{
      if(!actx||!bgmN.length)return;
      const o=actx.createOscillator();o.type='sawtooth';o.frequency.value=bass[bi%4];
      const g=actx.createGain();g.gain.value=.02;
      g.gain.linearRampToValueAtTime(0,actx.currentTime+.2);
      o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.2);bi++;
    },220);
    bgmN.push({stop:()=>clearInterval(bIv)});
  }else if(type==='nature_mel'){
    // nature + melancholy 동시 재생
    const f1='assets/audio/bgm_nature.mp3',f2='assets/audio/bgm_melancholy.mp3';
    const a1=new Audio(f1),a2=new Audio(f2);
    a1.loop=true;a2.loop=true;a1.volume=0;a2.volume=0;
    a1.play();a2.play();
    const mx1=0.35,mx2=0.3;
    let v1=0,v2=0;
    const fi=setInterval(()=>{
      v1+=mx1/40;v2+=mx2/40;
      if(v1>=mx1)v1=mx1;if(v2>=mx2)v2=mx2;
      a1.volume=v1;a2.volume=v2;
      if(v1>=mx1&&v2>=mx2)clearInterval(fi);
    },50);
    bgmN.push({stop:()=>{
      let vv1=a1.volume,vv2=a2.volume;
      const fo=setInterval(()=>{
        vv1-=.05;vv2-=.05;
        if(vv1<=0&&vv2<=0){clearInterval(fo);a1.pause();a2.pause();}
        a1.volume=Math.max(0,vv1);a2.volume=Math.max(0,vv2);
      },50);
    }});
    return;
  }else if(type==='melancholy'){
    bgmG.gain.value=.025;
    const o=actx.createOscillator();o.type='sine';o.frequency.value=110;
    const o2=actx.createOscillator();o2.type='sine';o2.frequency.value=138.6;
    o.connect(bgmG);o2.connect(bgmG);o.start();o2.start();bgmN.push(o,o2);
  }
}

let _curSfx=null;
function stopSfx(){if(_curSfx){_curSfx.pause();_curSfx.currentTime=0;_curSfx=null;}}
function playSfx(type){
  initA();stopSfx();
  const sfxFile='assets/audio/sfx_'+type+'.mp3';
  const sa=new Audio(sfxFile);
  sa.volume=0.6;sa.play().catch(()=>_synthSfx(type));
  _curSfx=sa;
  return;
}
function _synthSfx(type){
  const sr=actx.sampleRate;
  if(type==='throw'){
    const b=actx.createBuffer(1,sr*.08,sr),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
    const s=actx.createBufferSource(),g=actx.createGain();s.buffer=b;g.gain.value=.12;
    s.connect(g);g.connect(actx.destination);s.start();
  }else if(type==='sigh'){
    const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=180;
    g.gain.value=.04;o.connect(g);g.connect(actx.destination);o.start();
    g.gain.linearRampToValueAtTime(0,actx.currentTime+1.2);setTimeout(()=>o.stop(),1300);
  }else if(type==='impact'){
    const b=actx.createBuffer(1,sr*.15,sr),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5)*.8;
    const s=actx.createBufferSource(),g=actx.createGain();s.buffer=b;g.gain.value=.2;
    s.connect(g);g.connect(actx.destination);s.start();
  }else if(type==='crowd'){
    const b=actx.createBuffer(1,sr*.5,sr),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.2*(1+Math.sin(i/200)*.5);
    const s=actx.createBufferSource(),g=actx.createGain();s.buffer=b;g.gain.value=.08;
    s.connect(g);g.connect(actx.destination);s.start();
  }else if(type==='murmur'){
    // 웅웅거리는 군중 소리
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sawtooth';o.frequency.value=90;g.gain.value=.06;
    const lfo=actx.createOscillator(),lg=actx.createGain();
    lfo.frequency.value=2.5;lg.gain.value=.03;
    lfo.connect(lg);lg.connect(g.gain);
    o.connect(g);g.connect(actx.destination);o.start();lfo.start();
    setTimeout(()=>{g.gain.linearRampToValueAtTime(0,actx.currentTime+1);setTimeout(()=>{o.stop();lfo.stop();},1100);},2000);
  }
}

// ===== PIXEL ENGINE =====
function imgToBlocks(img,cb){
  const oc=document.createElement('canvas');
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  oc.width=iw;oc.height=ih;
  const ox=oc.getContext('2d');ox.drawImage(img,0,0);
  const raw=ox.getImageData(0,0,iw,ih);
  const bw=iw/SAMPLE_W,bh=ih/SAMPLE_H;
  const out=new Uint8Array(SAMPLE_W*SAMPLE_H);
  for(let by=0;by<SAMPLE_H;by++){
    for(let bx=0;bx<SAMPLE_W;bx++){
      const votes=new Uint16Array(PALETTE.length);
      const sx=Math.floor(bx*bw),sy=Math.floor(by*bh);
      const ex=Math.min(Math.floor((bx+1)*bw),iw),ey=Math.min(Math.floor((by+1)*bh),ih);
      for(let y=sy;y<ey;y++){
        for(let x=sx;x<ex;x++){
          const i=(y*iw+x)*4;
          const r=raw.data[i],g=raw.data[i+1],b2=raw.data[i+2];
          let md=Infinity,best=0;
          for(let p=0;p<PALETTE.length;p++){
            const d=(r-PALETTE[p][0])**2+(g-PALETTE[p][1])**2+(b2-PALETTE[p][2])**2;
            if(d<md){md=d;best=p;}
          }
          votes[best]++;
        }
      }
      let mv=0,w=0;
      for(let p=0;p<PALETTE.length;p++){if(votes[p]>mv){mv=votes[p];w=p;}}
      out[by*SAMPLE_W+bx]=w;
    }
  }
  // 후처리: 고립된 어두운 블록(0,10) 제거 — 5개 이하 연결이면 주변 최빈색으로
  const visited2=new Uint8Array(SAMPLE_W*SAMPLE_H);
  for(let i=0;i<out.length;i++){
    if((out[i]!==0&&out[i]!==10)||visited2[i]) continue;
    const queue2=[i],blob2=[];visited2[i]=1;
    while(queue2.length){
      const c2=queue2.shift();blob2.push(c2);
      const cy=Math.floor(c2/SAMPLE_W),cx=c2%SAMPLE_W;
      [[cy-1,cx],[cy+1,cx],[cy,cx-1],[cy,cx+1]].forEach(([ny,nx])=>{
        if(ny>=0&&ny<SAMPLE_H&&nx>=0&&nx<SAMPLE_W){
          const ni=ny*SAMPLE_W+nx;
          if(!visited2[ni]&&(out[ni]===0||out[ni]===10)){visited2[ni]=1;queue2.push(ni);}
        }
      });
    }
    if(blob2.length<=5){
      // 주변 비-어두운 색 중 최빈 찾기
      const votes2=new Uint16Array(PALETTE.length);
      blob2.forEach(bi=>{
        const by2=Math.floor(bi/SAMPLE_W),bx2=bi%SAMPLE_W;
        [[by2-1,bx2],[by2+1,bx2],[by2,bx2-1],[by2,bx2+1]].forEach(([ny,nx])=>{
          if(ny>=0&&ny<SAMPLE_H&&nx>=0&&nx<SAMPLE_W){
            const ni=ny*SAMPLE_W+nx;
            if(out[ni]!==0&&out[ni]!==10) votes2[out[ni]]++;
          }
        });
      });
      let mv2=0,w2=5; // default to blue-ish
      for(let p=0;p<PALETTE.length;p++){if(votes2[p]>mv2){mv2=votes2[p];w2=p;}}
      blob2.forEach(bi=>{out[bi]=w2;});
    }
  }
  cb(out);
}

function loadScene(idx,cb){
  const s=SCENES[idx];
  if(!s||!s.img){cb(null);return;}
  const img=new Image();img.src=s.img;
  img.onload=()=>imgToBlocks(img,cb);
  img.onerror=()=>cb(null);
}

// ===== RENDER =====
function drawBlocks(bl,offFn){
  if(!bl)return;
  for(let y=0;y<SAMPLE_H;y++){
    const ox=offFn?offFn(y,animT):0;
    for(let x=0;x<SAMPLE_W;x++){
      const c=PALETTE[bl[y*SAMPLE_W+x]];
      ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
      ctx.fillRect(Math.floor(x*BLOCK+ox),y*BLOCK,BLOCK+1,BLOCK);
    }
  }
}

function wave(y,t){return Math.sin(t*.015+y*.12)*Math.sin(t*.006)*2.5;}

function render(){
  requestAnimationFrame(render);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(cur>=SCENES.length)return;
  const sc=SCENES[cur];

  if(sc.id==='s22'){
    if(trans){
      const t=transP;
      if(blocks) drawBlocks(blocks,wave);
      const maxR=Math.sqrt(W*W+H*H)/2;
      const r=maxR*(1-t);
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.rect(0,0,W,H);
      ctx.moveTo(W/2+r,H/2);ctx.arc(W/2,H/2,r,0,Math.PI*2,true);
      ctx.fill();
      ctx.fillStyle='#000';ctx.fillRect(0,0,MASK,H);ctx.fillRect(W-MASK,0,MASK,H);
      transP+=.015;
      if(transP>=1){trans=false;blocks=null;}
      animT++;return;
    }
    // 크레딧 스크롤 + 버튼
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#666';ctx.font='7px monospace';ctx.textAlign='center';
    const creds=['','飛翔','','기획 · 연출','hwanginkeom','','바이브코딩 Lab','','2026'];
    const startY=H-animT*0.4;
    creds.forEach((line,i)=>{
      const ly=startY+i*14;
      if(ly>-10&&ly<H+10) ctx.fillText(line,W/2,ly);
    });
    ctx.fillStyle='#000';ctx.fillRect(0,0,MASK,H);ctx.fillRect(W-MASK,0,MASK,H);
    document.getElementById('ending-btns').classList.add('show');
    animT++;return;
  }

  if(trans&&nextBlocks){
    const t=transP,fx=sc.fx;
    if(fx==='glitch'){
      drawBlocks(blocks,(y,at)=>wave(y,at)+(Math.random()-.5)*t*8);
      ctx.globalAlpha=t;drawBlocks(nextBlocks,wave);ctx.globalAlpha=1;
    }else if(fx==='white'){
      if(t<.4){drawBlocks(blocks,wave);ctx.fillStyle=`rgba(255,255,255,${t/.4})`;ctx.fillRect(0,0,W,H);}
      else if(t<.6){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);}
      else{drawBlocks(nextBlocks,wave);ctx.fillStyle=`rgba(255,255,255,${1-(t-.6)/.4})`;ctx.fillRect(0,0,W,H);}
    }else if(fx==='natural'){
      if(blocks){ctx.globalAlpha=1-t;drawBlocks(blocks,wave);ctx.globalAlpha=1;}
      ctx.globalAlpha=t;drawBlocks(nextBlocks,wave);ctx.globalAlpha=1;
    }else{drawBlocks(nextBlocks,wave);}
    transP+=(SCENES[cur]&&SCENES[cur].fx==='pan_down')?.008:.02;
    if(transP>=1){trans=false;blocks=nextBlocks;nextBlocks=null;}
  }else{
    if((cur===8||cur===9||cur===10)&&blocks){
      // s09/s10: 어두운 실루엣(인덱스 0,10)만 위아래 부유
      const floatY=Math.sin(animT*.03)*2;
      for(let y=0;y<SAMPLE_H;y++){
        const ox=wave(y,animT);
        for(let x=0;x<SAMPLE_W;x++){
          const ci=blocks[y*SAMPLE_W+x];
          const c=PALETTE[ci];
          const yOff=(ci===0||ci===10)?floatY:0;
          ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
          ctx.fillRect(Math.floor(x*BLOCK+ox),Math.floor(y*BLOCK+yOff),BLOCK+1,BLOCK);
        }
      }
    }else{
      drawBlocks(blocks,wave);
    }
  }

  // s05(타이틀): 서서히 나타남
  if(cur===4&&!trans){
    const fadeAlpha=Math.min(animT/180,1);
    ctx.globalAlpha=1-fadeAlpha;
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }

  // 양쪽 마스크
  ctx.fillStyle='#000';ctx.fillRect(0,0,MASK,H);ctx.fillRect(W-MASK,0,MASK,H);
  animT++;
}

// ===== UI =====
function updateBar(){
  const pct=((cur)/Math.max(SCENES.length-1,1)*100);
  document.getElementById('progress-fill').style.width=pct+'%';
  // 영화관(s20) 이후 재생바 숨김
  const sc=SCENES[cur];
  document.getElementById('progress-wrap').style.opacity=(sc&&(sc.id==='s20'||sc.id==='s22'))?'0':'1';
}
function showNar(txt){
  if(!txt){narEl.classList.remove('show');return;}
  narEl.innerHTML=txt;narEl.classList.add('show');
}

// ===== CONTROL =====
function goTo(idx){
  if(idx>=SCENES.length)return;
  cur=idx;beat=0;
  const sc=SCENES[idx];
  document.getElementById('ending-btns').classList.remove('show');
  showNar(sc.beats[0]&&sc.beats[0].t?sc.beats[0].t:'');
  initA();
  if(sc.bgm)playBgm(sc.bgm);
  if(sc.sfx)playSfx(sc.sfx);
  else stopSfx();
  updateBar();
  loadScene(idx,bl=>{
    if(sc.fx&&sc.fx!=='cut'&&blocks){
      nextBlocks=bl;trans=true;transP=0;
    }else if(!bl&&sc.fx==='iris'&&blocks){
      // s22: 이미지 없지만 iris 트랜지션 필요
      trans=true;transP=0;
    }else{
      blocks=bl;
    }
  });
  if(sc.auto>0){clearTimeout(window._at);window._at=setTimeout(advance,sc.auto);}
}

function advance(){
  clearTimeout(window._at);
  const sc=SCENES[cur];if(!sc)return;
  if(beat<sc.beats.length-1){
    beat++;showNar(sc.beats[beat].t||'');
    if(sc.auto>0)window._at=setTimeout(advance,sc.auto);
  }else if(cur<SCENES.length-1){goTo(cur+1);}
}

function restart(){
  cur=0;beat=0;blocks=null;
  document.getElementById('ending-btns').classList.remove('show');
  document.getElementById('fullscreen-replay').classList.remove('show');
  narEl.classList.remove('show');
  goTo(0);
}

// ===== EVENTS =====
container.addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON')return;
  initA();
  if(actx&&actx.state==='suspended'){actx.resume().then(()=>{const sc=SCENES[cur];if(sc&&sc.bgm&&bgmN.length===0)playBgm(sc.bgm);});}
  
  if(e.shiftKey) advance();
});
document.getElementById('btn-replay').addEventListener('click',e=>{e.stopPropagation();restart();});
document.getElementById('btn-exit').addEventListener('click',e=>{
  e.stopPropagation();
  document.getElementById('ending-btns').classList.remove('show');
  const el=document.getElementById('fullscreen-replay');el.innerHTML='';el.classList.add('show');
  let c=0;(function add(){
    const b=document.createElement('button');b.textContent='다시보기 ▶';
    b.addEventListener('click',ev=>{ev.stopPropagation();restart();});
    el.appendChild(b);c++;if(c<80)setTimeout(add,Math.max(300-c*3,30));
  })();
});
document.getElementById('fullscreen-replay').addEventListener('click',restart);

document.getElementById('btn-credits').addEventListener('click',e=>{
  e.stopPropagation();
  document.getElementById('ending-btns').classList.remove('show');
  const el=document.getElementById('credits-screen');
  el.classList.add('show');
  const scenes=SCENES.filter(s=>s.img);
  let lines='\n\n\n飛翔\n\n\n';
  scenes.forEach(s=>{
    lines+='<img src="'+s.img+'">\n'+s.id+'\n\n';
  });
  lines+='\n\n\n— CREDITS —\n\n';
  lines+='기획 · 연출 · 개발\nhwanginkeom\n\n';
  lines+='바이브코딩 Lab\n2026\n\n\n\n';
  lines+='<span style="font-size:24px;color:#fff">Thank you</span>\n<span style="font-size:18px;color:#ccc">by 크에파</span>\n\n\n\n\n';
  el.innerHTML='<div class="credits-roll">'+lines+'</div>';
  // 애니메이션 끝나면 버튼 화면으로 복귀
  // 끝나면 멈춤 — 클릭으로만 나감
  el.addEventListener('click',()=>{el.classList.remove('show');document.getElementById('ending-btns').classList.add('show');});
});

// ===== START =====
render();
// 시작 화면 클릭 시 재생
document.getElementById('start-screen').addEventListener('click',()=>{initA();document.getElementById('start-screen').classList.add('hide');goTo(0);});
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비상</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            cursor: pointer;
        }

        #game-container {
            position: relative;
            background: #0a0a14;
            overflow: hidden;
            transition: width 1.2s ease, height 1.2s ease;
            border: 1px solid #222;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #narration {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            color: #eee;
            font-size: 11px;
            font-family: monospace;
            line-height: 1.8;
            text-align: center;
            max-width: 85%;
            display: none;
            z-index: 100;
            letter-spacing: 0.5px;
        }

        #narration.show { display: block; }

        #click-hint {
            position: absolute;
            bottom: 4px;
            right: 8px;
            color: rgba(255,255,255,0.2);
            font-size: 8px;
            font-family: monospace;
            z-index: 100;
            animation: blink 2s infinite;
        }

        @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:0.6} }

        #ending-btns {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 20px;
            z-index: 300;
        }

        #ending-btns.show { display: flex; }

        #ending-btns button {
            font-family: monospace;
            font-size: 11px;
            padding: 10px 22px;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
            letter-spacing: 1px;
        }

        #ending-btns button:hover { background: #fff; color: #000; }

        /* 나가기 → 공포 다시보기 */
        #fullscreen-replay {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }

        #fullscreen-replay.show { display: flex; }

        #fullscreen-replay .horror-text {
            font-family: monospace;
            font-size: 32px;
            color: #c00;
            letter-spacing: 4px;
            animation: horror-pulse 0.8s infinite;
            text-shadow: 0 0 10px #f00, 0 0 20px #900;
        }

        @keyframes horror-pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            25% { opacity: 0.7; transform: scale(1.02) skewX(-1deg); }
            50% { opacity: 1; transform: scale(0.98); }
            75% { opacity: 0.8; transform: scale(1.01) skewX(1deg); }
        }

        #fullscreen-replay .sub-text {
            font-family: monospace;
            font-size: 10px;
            color: #666;
            margin-top: 20px;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%,100%{opacity:0.6} 50%{opacity:0.2} 52%{opacity:0.8} 54%{opacity:0.3}
        }

        .back-btn {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 10000;
            padding: 4px 10px;
            background: transparent;
            color: #444;
            font-size: 9px;
            font-family: monospace;
            text-decoration: none;
        }

        .back-btn:hover { color: #aaa; }
    </style>
</head>
<body>
    <a href="../bridge.html" class="back-btn">← BACK</a>

    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="narration"></div>
        <div id="click-hint">▶</div>
        <div id="ending-btns">
            <button id="btn-replay">다시보기</button>
            <button id="btn-exit">나가기</button>
        </div>
    </div>

    <div id="fullscreen-replay">
        <div class="horror-text">다시보기</div>
        <div class="sub-text">나갈 수 없습니다</div>
    </div>

    <script>
    // === AUDIO ===
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

    function playAlarm() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g); g.connect(audioCtx.destination);
        osc.type = 'square'; g.gain.value = 0.06;
        osc.start();
        let c = 0;
        const iv = setInterval(() => { osc.frequency.value = c%2 ? 550 : 440; c++; if(c>8){clearInterval(iv);g.gain.value=0;osc.stop();}}, 120);
    }

    function playSiren() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g); g.connect(audioCtx.destination);
        osc.type = 'sawtooth'; g.gain.value = 0.05;
        osc.start();
        let t = 0;
        const iv = setInterval(() => { osc.frequency.value = 280+Math.sin(t*3)*180; t+=0.04; }, 25);
        setTimeout(() => { clearInterval(iv); g.gain.value=0; osc.stop(); }, 2200);
    }

    function playClap() {
        initAudio();
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.06, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5);
        const src = audioCtx.createBufferSource();
        const g = audioCtx.createGain();
        src.buffer=buf; src.connect(g); g.connect(audioCtx.destination);
        g.gain.value=0.15; src.start();
    }

    // === CANVAS ===
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const narrationEl = document.getElementById('narration');
    let W = 240, H = 60;

    function setAspect(ratio) {
        const maxW = Math.min(window.innerWidth * 0.9, 760);
        const maxH = window.innerHeight * 0.85;
        let w, h;
        if (ratio === '16:4') {
            w = maxW; h = w * (4/16);
            W = 240; H = 60;
        } else if (ratio === '4:3') {
            // 가로로 긴 4:3
            w = maxW; h = w * (3/4);
            if (h > maxH) { h = maxH; w = h * (4/3); }
            W = 200; H = 150;
        } else {
            const s = Math.min(maxW, maxH);
            w = s; h = s;
            W = 160; H = 160;
        }
        container.style.width = w + 'px';
        container.style.height = h + 'px';
        canvas.width = W; canvas.height = H;
    }

    function px(x, y, w, h, c) {
        ctx.fillStyle = c || '#fff';
        ctx.fillRect(Math.floor(x), Math.floor(y), w||1, h||1);
    }

    function txt(str, x, y, sz, c) {
        ctx.fillStyle = c || '#fff';
        ctx.font = 'bold ' + (sz||6) + 'px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(str, x, y);
    }

    // === COLORS ===
    const C = {
        skin: '#ffcc88',
        hair: '#4a3322',
        shirt: '#4488cc',
        pants: '#334466',
        sky: '#1a2a44',
        skyLight: '#2a4466',
        grass: '#2a5a2a',
        grassLight: '#3a7a3a',
        flower1: '#ff6688',
        flower2: '#ffaa44',
        flower3: '#aa66ff',
        sun: '#ffdd44',
        cloud: '#aabbcc',
        building: '#2a2a3a',
        window: '#ffeeaa',
        blood: '#cc2222',
        siren1: '#cc0000',
        siren2: '#0000aa',
    };

    // === PIXEL ELEMENTS ===
    function drawMan(x, y, opts = {}) {
        const { lying, arms, big } = opts;
        if (lying) {
            px(x-6, y, 12, 2, C.shirt);
            px(x+7, y-1, 3, 3, C.skin);
            px(x+7, y-3, 3, 2, C.hair);
            return;
        }
        // 머리
        px(x-1, y-9, 3, 2, C.hair);
        px(x-1, y-7, 3, 3, C.skin);
        // 몸
        px(x-1, y-4, 3, 4, C.shirt);
        // 팔
        if (arms === 'up') {
            px(x-3, y-7, 1, 4, C.skin);
            px(x+3, y-7, 1, 4, C.skin);
        } else if (arms === 'spread') {
            px(x-4, y-3, 3, 1, C.skin);
            px(x+2, y-3, 3, 1, C.skin);
        } else {
            px(x-2, y-3, 1, 3, C.skin);
            px(x+2, y-3, 1, 3, C.skin);
        }
        // 다리
        px(x-1, y, 1, 3, C.pants);
        px(x+1, y, 1, 3, C.pants);
    }

    function drawBird(x, y, t, color) {
        const c = color || '#ddd';
        px(x, y, 2, 1, c);
        const w = Math.floor(t/5)%2;
        px(x-1, y+(w?-1:1), 1, 1, c);
        px(x+2, y+(w?-1:1), 1, 1, c);
    }

    function drawButterfly(x, y, t, color) {
        const c = color || C.flower1;
        px(x, y, 1, 1, c);
        const w = Math.floor(t/6)%2;
        if(w){px(x-2,y-1,2,1,c);px(x+1,y-1,2,1,c);}
        else{px(x-1,y,1,1,c);px(x+1,y,1,1,c);}
    }

    function drawCloud(x, y, s) {
        px(x, y, 8*s, 2*s, C.cloud);
        px(x+2*s, y-2*s, 5*s, 2*s, C.cloud);
        px(x+1*s, y+2*s, 6*s, 1*s, C.cloud);
    }

    function drawTree(x, y, h) {
        px(x, y-h, 2, h, '#5a3a22');
        for(let dy=-4;dy<=3;dy++){
            const w = (4-Math.abs(dy))*2;
            px(x-w/2, y-h-5+dy, w, 1, '#3a8a3a');
        }
    }

    function drawFlower(x, y, color) {
        px(x, y, 1, 4, '#3a6a3a');
        px(x-1, y-1, 3, 1, color||C.flower1);
        px(x, y-2, 1, 1, C.sun);
    }

    function drawSun(x, y, t) {
        px(x-2, y-2, 5, 5, C.sun);
        for(let a=0;a<8;a++){
            const angle = a*(Math.PI*2/8)+t*0.008;
            px(x+Math.cos(angle)*6, y+Math.sin(angle)*6, 1, 1, C.sun);
        }
    }

    function drawGrassRow(y) {
        for(let i=0;i<W;i+=2){
            const h = 1+Math.floor(Math.random()*3);
            px(i, y-h, 1, h, Math.random()>0.5?C.grass:C.grassLight);
        }
    }

    // === SHOTS ===
    let currentShot = 0, animTime = 0;

    const shots = [
        // PART 1 — 16:4
        { a:'16:4', draw:s1_wake },
        { a:'16:4', draw:s2_alarm, snd:'alarm' },
        { a:'16:4', draw:s3_ohno, nar:'"조졌네…"' },
        { a:'16:4', draw:s4_late, nar:'남자는 지각을 했습니다' },
        { a:'16:4', draw:s5_run },
        { a:'16:4', draw:s6_hall },
        { a:'16:4', draw:s7_eyes },
        { a:'16:4', draw:s_trans1, auto:true },
        // PART 2 — 4:3 (가로로 긴)
        { a:'4:3', draw:s9_window },
        { a:'4:3', draw:s10_sky },
        { a:'4:3', draw:s11_neighbors },
        { a:'4:3', draw:s12_ground },
        { a:'4:3', draw:s_trans2, snd:'siren', auto:true },
        // PART 3 — 1:1
        { a:'1:1', draw:s13_fallen },
        { a:'1:1', draw:s14_crowd },
        { a:'1:1', draw:s15_smile },
        { a:'1:1', draw:s16_iris, auto:true },
        { a:'1:1', draw:s17_credits },
        { a:'1:1', draw:s18_audience, snd:'clap' },
    ];

    // === PART 1 ===
    function s1_wake(t) {
        ctx.fillStyle = '#0a0a18';
        ctx.fillRect(0,0,W,H);
        // 천장 디테일
        px(0, H*0.3, W, 1, '#1a1a2a');
        for(let i=0;i<W;i+=12) px(i, H*0.7, 8, 1, '#1a1a2a');
        // 눈뜨기
        const open = Math.min(t/50, 1);
        const bar = Math.floor(H*0.45*(1-open));
        px(0,0,W,bar,'#000');
        px(0,H-bar,W,bar,'#000');
    }

    function s2_alarm(t) {
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(0,0,W,H);
        const cx=W/2, cy=H/2;
        px(cx-10, cy-14, 20, 28, '#222');
        px(cx-8, cy-12, 16, 24, '#111');
        const blink = Math.floor(t/8)%2;
        txt('8:47', cx, cy+3, 8, blink?'#ff4444':'#661111');
        if(Math.floor(t/3)%2) ctx.translate(0.5,0);
    }

    function s3_ohno(t) {
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(0,0,W,H);
        drawMan(W/2, H/2+5);
        if(t>8) px(W/2+5, H/2-6, 1, 2, '#88ccff');
    }

    function s4_late(t) {
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(0,0,W,H);
    }

    function s5_run(t) {
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(0,0,W,H);
        // 스카이라인
        const bColors = ['#1a1a2e','#1e1e32','#222238','#1a1a2e','#202030'];
        for(let i=0;i<8;i++){
            const bh = 12+(i*9)%20;
            px(i*30, H-8-bh, 22, bh, bColors[i%5]);
            for(let r=0;r<Math.floor(bh/6);r++){
                px(i*30+3, H-8-bh+3+r*6, 2, 2, Math.random()>0.4?C.window:'#111');
                px(i*30+10, H-8-bh+3+r*6, 2, 2, Math.random()>0.5?C.window:'#111');
            }
        }
        px(0,H-8,W,1,'#333');
        // 달리는 캐릭터
        const rx = 40+(t*0.4)%30;
        const bob = Math.floor(t/3)%2;
        drawMan(rx, H-10-bob, {arms:t%6<3?'spread':undefined});
        px(rx+3, H-10-bob-7, 3, 2, '#dda044'); // 빵
    }

    function s6_hall(t) {
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(0,0,W,H);
        px(0,H*0.25,W,1,'#2a2a3a');
        px(0,H*0.75,W,1,'#2a2a3a');
        for(let i=0;i<15;i++) px(i*16+5, H*0.25, 1, H*0.5, '#1a1a2a');
        px(0,H*0.6,W,1,'#2a2a3a');
        const wx = 20+(t*0.4)%(W-40);
        drawMan(wx, H*0.55);
    }

    function s7_eyes(t) {
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(0,0,W,H);
        const cx=W/2, cy=H/2;
        // 큰 얼굴
        px(cx-7, cy-8, 14, 12, C.skin);
        px(cx-7, cy-10, 14, 4, C.hair);
        // 큰 눈
        px(cx-4, cy-3, 3, 3, '#fff');
        px(cx+2, cy-3, 3, 3, '#fff');
        px(cx-3, cy-2, 2, 2, '#226');
        px(cx+3, cy-2, 2, 2, '#226');
        // 하이라이트
        if(Math.floor(t/6)%3!==0){
            px(cx-3, cy-3, 1, 1, '#fff');
            px(cx+3, cy-3, 1, 1, '#fff');
        }
        // 반짝이
        const sp = [[-12,-5],[10,-7],[-9,5],[11,3]];
        sp.forEach(([sx,sy],i)=>{
            if((t+i*5)%18<9){
                px(cx+sx,cy+sy,1,1,C.sun);
                px(cx+sx-1,cy+sy,3,1,C.sun);
                px(cx+sx,cy+sy-1,1,3,C.sun);
            }
        });
    }

    function s_trans1(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,W,H);
        if(t>40) nextShot();
    }

    // === PART 2 — 평화롭고 아름다운 (4:3 가로) ===
    function s9_window(t) {
        // 하늘 배경
        ctx.fillStyle = C.sky;
        ctx.fillRect(0,0,W,H);
        // 하늘 그라데이션
        for(let i=0;i<H*0.6;i++){
            const r=26+i*0.1, g=42+i*0.15, b=68+i*0.2;
            px(0,i,W,1,`rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`);
        }
        // 태양
        drawSun(W-35, 25, t);
        // 구름
        drawCloud(15+(t*0.1)%80, 18, 1.2);
        drawCloud(80+(t*0.07)%70, 30, 1);
        drawCloud(140+(t*0.09)%60, 22, 0.8);
        // 먼 산
        for(let i=0;i<W;i++){
            const mh = 15+Math.sin(i*0.02)*8+Math.sin(i*0.05)*5;
            px(i, H*0.55-mh+60, 1, mh, '#2a4a3a');
        }
        // 나무들
        drawTree(25, H*0.72, 18);
        drawTree(60, H*0.72, 14);
        drawTree(110, H*0.72, 20);
        drawTree(155, H*0.72, 16);
        // 풀밭
        px(0, H*0.72, W, H*0.28, C.grass);
        drawGrassRow(H*0.72);
        // 새
        for(let i=0;i<5;i++){
            const bx=20+i*35+Math.sin(t*0.025+i)*10;
            const by=35+Math.sin(t*0.02+i*1.5)*12;
            drawBird(bx, by, t+i*3, '#ddd');
        }
        // 창틀
        px(0,0,W,6,'#3a2a1a'); px(0,H-6,W,6,'#3a2a1a');
        px(0,0,6,H,'#3a2a1a'); px(W-6,0,6,H,'#3a2a1a');
        px(W/2-1,0,2,H,'#3a2a1a'); px(0,H/2-1,W,2,'#3a2a1a');
    }

    function s10_sky(t) {
        // 하늘에서 새들과 춤 — 매우 평화로운
        // 하늘 그라데이션
        for(let i=0;i<H;i++){
            const r=20+i*0.08, g=35+i*0.12, b=55+i*0.18;
            px(0,i,W,1,`rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`);
        }
        // 구름 여러겹
        drawCloud(5+(t*0.12)%(W+20), 20, 1.5);
        drawCloud(60+(t*0.08)%(W+20), 45, 1.2);
        drawCloud(120+(t*0.1)%(W+20), 65, 1);
        drawCloud(-10+(t*0.06)%(W+30), 85, 0.8);
        // 캐릭터 — 평화롭게 부유
        const fy = H*0.4+Math.sin(t*0.02)*15;
        drawMan(W/2, fy, {arms:'spread'});
        // 새들 — 원형으로 빙빙
        for(let i=0;i<8;i++){
            const a = t*0.012+i*(Math.PI*2/8);
            const r = 30+Math.sin(t*0.008+i)*8;
            const bx = W/2+Math.cos(a)*r;
            const by = fy-5+Math.sin(a)*(r*0.4);
            drawBird(bx, by, t+i*4);
        }
        // 나비
        for(let i=0;i<4;i++){
            const colors = [C.flower1, C.flower2, C.flower3, '#88ddff'];
            const bx = W*0.15+i*W*0.22+Math.sin(t*0.018+i*2)*12;
            const by = H*0.65+Math.cos(t*0.022+i)*10;
            drawButterfly(bx, by, t+i*7, colors[i]);
        }
    }

    function s11_neighbors(t) {
        // 아파트 외벽
        ctx.fillStyle = '#2a2832';
        ctx.fillRect(0,0,W,H);
        // 벽 텍스처
        for(let i=0;i<W;i+=10) px(i,0,1,H,'#252330');
        for(let i=0;i<H;i+=8) px(0,i,W,1,'#252330');
        // 창문들 — 따뜻한 빛
        for(let row=0;row<4;row++){
            for(let col=0;col<4;col++){
                const wx=15+col*46, wy=10+row*35;
                px(wx, wy, 28, 22, '#1a1820');
                px(wx+2, wy+2, 24, 18, '#2a2520');
                // 따뜻한 빛
                px(wx+3, wy+3, 22, 16, '#332a1a');
                // 주민
                if((row*4+col)%2===0){
                    px(wx+10, wy+8, 3, 3, C.skin);
                    px(wx+10, wy+6, 3, 2, C.hair);
                    px(wx+10, wy+11, 3, 4, C.shirt);
                    // 손 흔들기
                    const wave = Math.floor(t/10+row+col)%2;
                    px(wx+14, wy+7-wave*2, 2, 1, C.skin);
                }
            }
        }
        // 캐릭터 (옆에서 팔 벌리고 지나감 — 평화로운 느낌)
        const fy = 12+(t*0.6)%(H*0.6);
        drawMan(W/2+30, fy, {arms:'spread'});
    }

    function s12_ground(t) {
        // 바닥 — 꽃밭
        // 하늘
        for(let i=0;i<H*0.35;i++){
            const r=22+i*0.12, g=38+i*0.15, b=60+i*0.2;
            px(0,i,W,1,`rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`);
        }
        // 풀밭
        px(0, H*0.35, W, H*0.65, C.grass);
        drawGrassRow(H*0.35);
        drawGrassRow(H*0.4);
        drawGrassRow(H*0.45);
        // 꽃들 — 가득
        const flowerColors = [C.flower1, C.flower2, C.flower3, '#ffaacc', '#aaddff'];
        for(let i=0;i<16;i++){
            drawFlower(8+i*12, H*0.42+(i%4)*12, flowerColors[i%5]);
        }
        // 나무
        drawTree(10, H*0.38, 22);
        drawTree(W-15, H*0.38, 18);
        drawTree(W/2, H*0.36, 25);
        // 나비 많이
        for(let i=0;i<6;i++){
            const bx=15+i*30+Math.sin(t*0.02+i*1.2)*8;
            const by=H*0.25+Math.cos(t*0.018+i*0.7)*12;
            drawButterfly(bx, by, t+i*5, flowerColors[i%5]);
        }
        // 캐릭터 — 꽃밭에서 양팔 벌림
        const bobY = Math.sin(t*0.025)*4;
        drawMan(W/2, H*0.3+bobY, {arms:'spread'});
    }

    function s_trans2(t) {
        const flash = Math.floor(t/5)%2;
        ctx.fillStyle = flash?C.siren1:C.siren2;
        ctx.fillRect(0,0,W,H);
        const intensity = Math.min(t/30, 1);
        ctx.globalAlpha = intensity;
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,W,H);
        ctx.globalAlpha = 1;
        if(t>55) nextShot();
    }

    // === PART 3 ===
    function s13_fallen(t) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0,0,W,H);
        // 아스팔트
        px(0, H*0.65, W, H*0.35, '#1a1a1a');
        px(0, H*0.65, W, 1, '#333');
        // 누워있는 캐릭터
        drawMan(W/2, H*0.7, {lying:true});
        // 피
        const spread = Math.min(t*0.15, 12);
        px(W/2+8, H*0.71, spread, 2, C.blood);
        px(W/2+6, H*0.73, spread+3, 1, '#880011');
        // 서있는 사람들
        for(let i=0;i<7;i++) drawMan(15+i*20, H*0.5);
    }

    function s14_crowd(t) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0,0,W,H);
        // 어른 + 아이 (눈 가림)
        drawMan(45, H*0.55);
        px(50, H*0.55-5, 7, 1, C.skin); // 손
        // 아이
        px(58, H*0.55-3, 2, 2, C.skin);
        px(58, H*0.55-1, 2, 3, '#88aacc');
        px(57, H*0.55+2, 1, 2, C.pants);
        px(60, H*0.55+2, 1, 2, C.pants);

        // 소리치는 어른
        drawMan(115, H*0.55, {arms:'up'});
        // 말풍선
        px(92, H*0.2, 56, 18, '#fff');
        px(115, H*0.38, 2, 4, '#fff');
        txt('집값 떨어진다!', 120, H*0.2+12, 7, '#000');
    }

    function s15_smile(t) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0,0,W,H);
        const cx=W/2, cy=H/2;
        // 큰 얼굴
        px(cx-14, cy-16, 28, 30, C.skin);
        px(cx-14, cy-20, 28, 6, C.hair);
        // 눈
        px(cx-7, cy-7, 5, 5, '#fff');
        px(cx+3, cy-7, 5, 5, '#fff');
        px(cx-5, cy-5, 3, 3, '#226');
        px(cx+5, cy-5, 3, 3, '#226');
        // 웃는 입
        px(cx-6, cy+6, 12, 2, '#c44');
        px(cx-7, cy+5, 1, 1, '#c44');
        px(cx+6, cy+5, 1, 1, '#c44');
    }

    function s16_iris(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,W,H);
        const cx=W/2, cy=H/2;
        const progress = Math.min(t/90, 1);
        const maxR = Math.max(W,H)*0.5;
        const r = maxR*(1-progress);
        if(r>1){
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI*2);
            ctx.clip();
            px(cx-14, cy-16, 28, 30, C.skin);
            px(cx-14, cy-20, 28, 6, C.hair);
            px(cx-7, cy-7, 5, 5, '#fff');
            px(cx+3, cy-7, 5, 5, '#fff');
            px(cx-5, cy-5, 3, 3, '#226');
            px(cx+5, cy-5, 3, 3, '#226');
            px(cx-6, cy+6, 12, 2, '#c44');
            ctx.restore();
        }
        if(progress>=1) setTimeout(()=>nextShot(), 600);
    }

    function s17_credits(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,W,H);
        const lines = ['감독 · 기획','','hwanginkeom','','바이브코딩 Lab','','2026','','','FIN'];
        const sy = H-t*0.2;
        lines.forEach((l,i)=>{
            const ly = sy+i*16;
            if(ly>-8&&ly<H+8) txt(l, W/2, ly, 6, '#fff');
        });
    }

    function s18_audience(t) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0,0,W,H);
        // 스크린
        px(W*0.2, 5, W*0.6, H*0.25, '#111');
        txt('FIN', W/2, H*0.13+5, 10, '#fff');
        // 관객
        for(let row=0;row<4;row++){
            for(let col=0;col<8;col++){
                const hx=8+col*18, hy=H*0.45+row*16;
                px(hx, hy, 5, 5, C.skin);
                px(hx, hy-2, 5, 2, C.hair);
                if(Math.floor(t/4+col+row)%2===0){
                    px(hx-1,hy+5,2,1,C.skin);
                    px(hx+4,hy+5,2,1,C.skin);
                }
            }
        }
        if(t%20===0&&t>0&&t<160) playClap();
        if(t>80) document.getElementById('ending-btns').classList.add('show');
    }

    // === LOGIC ===
    function nextShot() {
        if(currentShot<shots.length-1){
            currentShot++; animTime=0;
            const s = shots[currentShot];
            setAspect(s.a);
            if(s.snd==='alarm') playAlarm();
            if(s.snd==='siren') playSiren();
            if(s.snd==='clap') playClap();
            if(s.nar){narrationEl.textContent=s.nar;narrationEl.classList.add('show');}
            else{narrationEl.classList.remove('show');}
        }
    }

    function startGame() {
        currentShot=0; animTime=0;
        document.getElementById('ending-btns').classList.remove('show');
        document.getElementById('fullscreen-replay').classList.remove('show');
        narrationEl.classList.remove('show');
        setAspect(shots[0].a);
    }

    container.addEventListener('click', function(e){
        if(e.target.tagName==='BUTTON') return;
        initAudio();
        if(!shots[currentShot].auto) nextShot();
    });

    document.getElementById('btn-replay').addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
    document.getElementById('btn-exit').addEventListener('click', function(e){
        e.stopPropagation();
        document.getElementById('ending-btns').classList.remove('show');
        document.getElementById('fullscreen-replay').classList.add('show');
    });
    document.getElementById('fullscreen-replay').addEventListener('click', startGame);

    // === RENDER ===
    function render(){
        requestAnimationFrame(render);
        ctx.save();
        ctx.clearRect(0,0,W,H);
        const s = shots[currentShot];
        if(s&&s.draw) s.draw(animTime);
        ctx.restore();
        animTime++;
    }

    setAspect('16:4');
    render();
    </script>
</body>
</html>

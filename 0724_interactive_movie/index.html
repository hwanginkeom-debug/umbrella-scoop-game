<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 무비</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            background: #000;
            overflow: hidden;
            transition: width 1.5s cubic-bezier(0.4,0,0.2,1), height 1.5s cubic-bezier(0.4,0,0.2,1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #narration {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 12px 20px;
            font-size: 9px;
            line-height: 2;
            border: 2px solid #fff;
            border-radius: 4px;
            max-width: 80%;
            text-align: center;
            display: none;
            z-index: 100;
            white-space: pre-line;
        }

        #narration.show { display: block; }

        #click-hint {
            position: absolute;
            bottom: 8px;
            right: 12px;
            color: rgba(255,255,255,0.4);
            font-size: 7px;
            z-index: 100;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #iris-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 200;
            display: none;
        }

        #ending-btns {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 16px;
            z-index: 300;
        }

        #ending-btns.show { display: flex; }

        #ending-btns button {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 12px 20px;
            background: #222;
            color: #fff;
            border: 2px solid #fff;
            cursor: pointer;
            transition: all 0.2s;
        }

        #ending-btns button:hover {
            background: #fff;
            color: #000;
        }

        #fullscreen-replay {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }

        #fullscreen-replay.show { display: flex; }

        #fullscreen-replay span {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #fff;
            border: 3px solid #fff;
            padding: 20px 40px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .back-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10000;
            padding: 6px 12px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 7px;
            font-family: 'Press Start 2P', monospace;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <a href="../bridge.html" class="back-btn">← BACK</a>

    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="narration"></div>
        <div id="click-hint">▶ CLICK</div>
        <svg id="iris-overlay" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div id="ending-btns">
            <button id="btn-replay">다시보기</button>
            <button id="btn-exit">나가기</button>
        </div>
    </div>

    <div id="fullscreen-replay">
        <span>다시보기</span>
    </div>

    <script>
    // ==================== AUDIO ====================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playAlarm() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        osc.type = 'square';
        gain.gain.value = 0.15;
        osc.start();
        setTimeout(() => { gain.gain.value = 0; osc.stop(); }, 400);
    }

    function playSiren() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        gain.gain.value = 0.12;
        osc.start();
        let t = 0;
        const interval = setInterval(() => {
            osc.frequency.value = 400 + Math.sin(t * 4) * 200;
            t += 0.05;
        }, 50);
        setTimeout(() => { clearInterval(interval); gain.gain.value = 0; osc.stop(); }, 2000);
    }

    function playClap() {
        initAudio();
        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
        }
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        source.buffer = buffer;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.value = 0.3;
        source.start();
    }

    // ==================== PIXEL DRAWING ====================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const narrationEl = document.getElementById('narration');

    let W = 320, H = 180; // 기본 16:9 비율의 픽셀 해상도
    canvas.width = W;
    canvas.height = H;

    function setAspect(ratio) {
        // ratio: '16:4', '3:4', '1:1'
        const maxW = Math.min(window.innerWidth * 0.9, 800);
        const maxH = window.innerHeight * 0.85;
        let w, h;

        if (ratio === '16:4') {
            w = maxW;
            h = w * (4/16);
            W = 320; H = 80;
        } else if (ratio === '3:4') {
            h = maxH;
            w = h * (3/4);
            W = 240; H = 320;
        } else { // 1:1
            const s = Math.min(maxW, maxH);
            w = s; h = s;
            W = 256; H = 256;
        }

        container.style.width = w + 'px';
        container.style.height = h + 'px';
        canvas.width = W;
        canvas.height = H;
    }

    // 픽셀 그리기 유틸
    function fillRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    function drawPixelText(text, x, y, color, size) {
        ctx.fillStyle = color || '#fff';
        ctx.font = (size || 8) + 'px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(text, x, y);
    }

    // 간단한 픽셀 캐릭터
    function drawCharacter(x, y, scale, options = {}) {
        const s = scale || 1;
        const { sleeping, bread, closeup, smile } = options;

        // 머리
        fillRect(x - 4*s, y - 12*s, 8*s, 8*s, '#ffcc88'); // 피부
        // 머리카락
        fillRect(x - 4*s, y - 14*s, 8*s, 4*s, '#333');
        // 눈
        if (sleeping) {
            fillRect(x - 3*s, y - 9*s, 2*s, 1*s, '#333');
            fillRect(x + 1*s, y - 9*s, 2*s, 1*s, '#333');
        } else if (closeup) {
            // 초롱초롱한 눈
            fillRect(x - 3*s, y - 10*s, 3*s, 3*s, '#333');
            fillRect(x + 1*s, y - 10*s, 3*s, 3*s, '#333');
            fillRect(x - 2*s, y - 9*s, 1*s, 1*s, '#fff');
            fillRect(x + 2*s, y - 9*s, 1*s, 1*s, '#fff');
        } else {
            fillRect(x - 2*s, y - 9*s, 2*s, 2*s, '#333');
            fillRect(x + 1*s, y - 9*s, 2*s, 2*s, '#333');
        }
        // 입
        if (smile) {
            fillRect(x - 1*s, y - 6*s, 3*s, 1*s, '#c44');
        } else if (bread) {
            fillRect(x + 2*s, y - 7*s, 4*s, 3*s, '#dda044'); // 빵
        }
        // 몸
        fillRect(x - 3*s, y - 4*s, 6*s, 8*s, '#4488cc'); // 상의
        // 다리
        fillRect(x - 3*s, y + 4*s, 2*s, 4*s, '#334');
        fillRect(x + 1*s, y + 4*s, 2*s, 4*s, '#334');
    }

    // 배경 그리기 함수들
    function drawSky(yStart, yEnd, colors) {
        const gradient = colors || ['#87CEEB', '#B0E0E6', '#E0F7FF'];
        const h = yEnd - yStart;
        gradient.forEach((c, i) => {
            const segH = h / gradient.length;
            fillRect(0, yStart + i * segH, W, segH + 1, c);
        });
    }

    function drawClouds(y, time) {
        const cloudColor = '#fff';
        for (let i = 0; i < 4; i++) {
            const cx = ((i * 80 + time * 0.2) % (W + 40)) - 20;
            fillRect(cx, y + i * 5, 24, 6, cloudColor);
            fillRect(cx + 4, y + i * 5 - 4, 16, 4, cloudColor);
        }
    }

    function drawGrass(y, h) {
        fillRect(0, y, W, h, '#4a8c3f');
        for (let i = 0; i < W; i += 4) {
            fillRect(i, y, 2, 2 + Math.random() * 3, '#3a7c2f');
        }
    }

    function drawBuilding(x, y, w, h, color) {
        fillRect(x, y - h, w, h, color);
        // 창문
        for (let row = 0; row < Math.floor(h/10); row++) {
            for (let col = 0; col < Math.floor(w/8); col++) {
                const lit = Math.random() > 0.3;
                fillRect(x + 4 + col * 8, y - h + 4 + row * 10, 4, 5, lit ? '#ffee88' : '#334');
            }
        }
    }

    // ==================== SCENES ====================
    let currentShot = 0;
    let animTime = 0;
    let sceneStartTime = 0;

    const shots = [
        // PART 1 — 일상 (16:4)
        { aspect: '16:4', draw: drawShot1, narration: null, sound: null },
        { aspect: '16:4', draw: drawShot2, narration: null, sound: 'alarm' },
        { aspect: '16:4', draw: drawShot3, narration: '"조졌네…"', sound: null },
        { aspect: '16:4', draw: drawShot4, narration: '[나레이션] 남자는 지각을 했습니다', sound: null },
        { aspect: '16:4', draw: drawShot5, narration: null, sound: null },
        { aspect: '16:4', draw: drawShot6, narration: null, sound: null },
        { aspect: '16:4', draw: drawShot7, narration: null, sound: null },
        // 화면비 전환 표시
        { aspect: '16:4', draw: drawTransition1, narration: null, sound: null, auto: true },
        // PART 2 — 비상 (3:4)
        { aspect: '3:4', draw: drawShot9, narration: null, sound: null },
        { aspect: '3:4', draw: drawShot10, narration: null, sound: null },
        { aspect: '3:4', draw: drawShot11, narration: null, sound: null },
        { aspect: '3:4', draw: drawShot12, narration: null, sound: null },
        // 화면비 전환 (사이렌)
        { aspect: '3:4', draw: drawTransition2, narration: null, sound: 'siren', auto: true },
        // PART 3 — 착지 (1:1)
        { aspect: '1:1', draw: drawShot13, narration: null, sound: null },
        { aspect: '1:1', draw: drawShot14, narration: null, sound: null },
        { aspect: '1:1', draw: drawShot15, narration: null, sound: null },
        { aspect: '1:1', draw: drawShot16_iris, narration: null, sound: null, auto: true },
        { aspect: '1:1', draw: drawShot17_credits, narration: null, sound: null },
        { aspect: '1:1', draw: drawShot18_audience, narration: null, sound: 'clap' },
    ];

    // --- PART 1 SHOTS ---
    function drawShot1(t) {
        // 침대에서 일어남 — 1인칭
        fillRect(0, 0, W, H, '#1a1a2e');
        // 천장
        fillRect(0, 0, W, H * 0.3, '#2a2a3e');
        // 이불 시야 (아래쪽)
        fillRect(0, H * 0.6, W, H * 0.4, '#6688bb');
        fillRect(0, H * 0.7, W, H * 0.3, '#5577aa');
        // 눈 뜨는 효과 — 위아래 검은 바
        const openAmt = Math.min(t / 60, 1);
        const barH = H * 0.4 * (1 - openAmt);
        fillRect(0, 0, W, barH, '#000');
        fillRect(0, H - barH, W, barH, '#000');
    }

    function drawShot2(t) {
        // 핸드폰 알람
        fillRect(0, 0, W, H, '#1a1a2e');
        // 손 + 폰
        fillRect(W/2 - 15, H/2 - 20, 30, 40, '#222');
        fillRect(W/2 - 13, H/2 - 18, 26, 36, '#115533');
        // 알람 텍스트
        drawPixelText('08:47', W/2, H/2 - 4, '#ff4444', 6);
        drawPixelText('ALARM', W/2, H/2 + 8, '#ffaa00', 5);
        // 진동 효과
        if (Math.floor(t / 8) % 2 === 0) {
            ctx.translate(1, 0);
        }
    }

    function drawShot3(t) {
        // "조졌네" 반응 — 얼굴 클로즈업
        fillRect(0, 0, W, H, '#1a1a2e');
        drawCharacter(W/2, H/2 + 8, 3, { sleeping: false });
        // 땀방울
        fillRect(W/2 + 14, H/2 - 20, 2, 4, '#88ccff');
    }

    function drawShot4(t) {
        // 나레이션 씬 — 시계
        fillRect(0, 0, W, H, '#0d0d1a');
        // 큰 시계
        ctx.beginPath();
        ctx.arc(W/2, H/2, 25, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(W/2, H/2, 23, 0, Math.PI * 2);
        ctx.fillStyle = '#eee';
        ctx.fill();
        drawPixelText('8:47', W/2, H/2 + 3, '#c00', 6);
    }

    function drawShot5(t) {
        // 빵을 물고 나섬
        drawSky(0, H * 0.5);
        drawGrass(H * 0.7, H * 0.3);
        // 도로
        fillRect(0, H * 0.65, W, H * 0.1, '#555');
        // 캐릭터 달리기
        const runX = 60 + Math.sin(t * 0.1) * 3;
        const bobY = Math.abs(Math.sin(t * 0.3)) * 3;
        drawCharacter(runX, H * 0.6 - bobY, 2, { bread: true });
    }

    function drawShot6(t) {
        // 복도식 아파트
        fillRect(0, 0, W, H, '#87CEEB');
        drawClouds(5, t);
        // 아파트
        drawBuilding(20, H, 60, H * 0.8, '#887766');
        drawBuilding(90, H, 50, H * 0.6, '#776655');
        // 복도 난간
        for (let i = 0; i < 6; i++) {
            fillRect(22 + i * 10, H * 0.4, 8, 2, '#aaa');
        }
        // 캐릭터 걷기
        const walkX = 30 + (t % 100) * 0.5;
        drawCharacter(walkX, H * 0.55, 1.5, { bread: true });
    }

    function drawShot7(t) {
        // 초롱초롱한 눈 클로즈업
        fillRect(0, 0, W, H, '#ffeedd');
        drawCharacter(W/2, H/2 + 5, 4, { closeup: true });
        // 반짝이 효과
        const sparkles = [[W/2-20, H/2-25], [W/2+18, H/2-20], [W/2-15, H/2+15]];
        sparkles.forEach(([sx, sy], i) => {
            if (Math.floor(t/10 + i) % 3 === 0) {
                fillRect(sx, sy, 3, 3, '#ffdd00');
                fillRect(sx+1, sy-1, 1, 5, '#ffdd00');
                fillRect(sx-1, sy+1, 5, 1, '#ffdd00');
            }
        });
    }

    function drawTransition1(t) {
        // 화면비 전환 연출
        fillRect(0, 0, W, H, '#000');
        if (t > 30) {
            drawPixelText('· · ·', W/2, H/2, '#fff', 8);
        }
        if (t > 60) {
            nextShot();
        }
    }

    // --- PART 2 SHOTS ---
    function drawShot9(t) {
        // 창밖 풍경
        drawSky(0, H * 0.6, ['#88ccff', '#aaddff', '#ccf0ff']);
        drawClouds(20, t);
        // 산/나무
        fillRect(0, H * 0.55, W, H * 0.1, '#5a9e4a');
        drawGrass(H * 0.6, H * 0.4);
        // 창틀
        fillRect(0, 0, W, 8, '#554433');
        fillRect(0, H - 8, W, 8, '#554433');
        fillRect(0, 0, 8, H, '#554433');
        fillRect(W - 8, 0, 8, H, '#554433');
        fillRect(W/2 - 2, 0, 4, H, '#554433');
        // 새
        for (let i = 0; i < 3; i++) {
            const bx = 50 + i * 40 + Math.sin(t * 0.05 + i) * 10;
            const by = 40 + Math.sin(t * 0.08 + i * 2) * 15;
            fillRect(bx, by, 4, 2, '#333');
            fillRect(bx - 2, by - 1, 2, 1, '#333');
            fillRect(bx + 4, by - 1, 2, 1, '#333');
        }
    }

    function drawShot10(t) {
        // 하늘의 새들과 춤 (높이 = 하늘)
        drawSky(0, H, ['#4488dd', '#66aaee', '#88ccff']);
        drawClouds(30, t);
        drawClouds(100, t * 0.7);
        // 캐릭터 — 하늘에 떠있음
        const floatY = H * 0.4 + Math.sin(t * 0.04) * 20;
        drawCharacter(W/2, floatY, 2, { smile: true });
        // 새들 주위를 빙빙
        for (let i = 0; i < 5; i++) {
            const angle = t * 0.03 + i * (Math.PI * 2 / 5);
            const bx = W/2 + Math.cos(angle) * 50;
            const by = floatY + Math.sin(angle) * 30 - 10;
            fillRect(bx, by, 4, 2, '#333');
            fillRect(bx - 2, by - 1, 2, 1, '#333');
            fillRect(bx + 4, by - 1, 2, 1, '#333');
        }
    }

    function drawShot11(t) {
        // 아랫집 주민들과 인사 (중간 층)
        // 아파트 벽
        fillRect(0, 0, W, H, '#ccbbaa');
        // 창문들
        for (let row = 0; row < 4; row++) {
            for (let col = 0; col < 3; col++) {
                const wx = 30 + col * 70;
                const wy = 20 + row * 75;
                fillRect(wx, wy, 40, 50, '#88ccff');
                fillRect(wx, wy + 50, 40, 3, '#665544');
                // 주민 (일부 창문)
                if ((row + col) % 2 === 0) {
                    fillRect(wx + 15, wy + 25, 8, 8, '#ffcc88');
                    fillRect(wx + 15, wy + 20, 8, 6, '#333');
                    // 손 흔들기
                    if (Math.floor(t / 15) % 2 === 0) {
                        fillRect(wx + 24, wy + 22, 4, 2, '#ffcc88');
                    } else {
                        fillRect(wx + 24, wy + 26, 4, 2, '#ffcc88');
                    }
                }
            }
        }
        // 떨어지는 캐릭터
        const fallY = H * 0.3 + (t % 40) * 0.5;
        drawCharacter(W/2, fallY, 1.5, { smile: true });
    }

    function drawShot12(t) {
        // 땅의 벌레·꽃과 춤 (땅에 도달)
        fillRect(0, 0, W, H * 0.3, '#88ccff');
        drawGrass(H * 0.3, H * 0.7);
        // 꽃
        const flowers = [[30, H*0.5], [80, H*0.6], [150, H*0.55], [200, H*0.65]];
        flowers.forEach(([fx, fy]) => {
            fillRect(fx, fy, 2, 8, '#3a6b2a');
            fillRect(fx - 2, fy - 4, 6, 4, '#ff88aa');
            fillRect(fx, fy - 6, 2, 2, '#ffdd00');
        });
        // 벌레
        for (let i = 0; i < 3; i++) {
            const bx = 50 + i * 60 + Math.sin(t * 0.1 + i) * 5;
            const by = H * 0.7 + Math.cos(t * 0.08 + i) * 3;
            fillRect(bx, by, 4, 3, '#4a2');
            fillRect(bx + 4, by, 2, 1, '#4a2');
        }
        // 캐릭터 (바닥에 도달 직전)
        drawCharacter(W/2, H * 0.4 + Math.sin(t * 0.06) * 5, 2, { smile: true });
    }

    function drawTransition2(t) {
        // 사이렌 전환
        const flash = Math.floor(t / 8) % 2;
        fillRect(0, 0, W, H, flash ? '#cc0000' : '#0000cc');
        if (t > 60) {
            nextShot();
        }
    }

    // --- PART 3 SHOTS ---
    function drawShot13(t) {
        // 바닥에서 피를 흘리며 웃고 있음
        fillRect(0, 0, W, H, '#333');
        // 바닥
        fillRect(0, H * 0.7, W, H * 0.3, '#555');
        // 캐릭터 (누워있음)
        fillRect(W/2 - 15, H * 0.65, 30, 8, '#4488cc'); // 몸
        fillRect(W/2 + 12, H * 0.63, 8, 8, '#ffcc88'); // 머리
        fillRect(W/2 + 12, H * 0.61, 8, 4, '#333'); // 머리카락
        // 미소
        fillRect(W/2 + 14, H * 0.67, 3, 1, '#c44');
        // 피
        fillRect(W/2 + 5, H * 0.7, 20, 3, '#880022');
        fillRect(W/2 + 10, H * 0.72, 8, 2, '#660018');
        // 주변 사람들
        for (let i = 0; i < 5; i++) {
            const px = 40 + i * 40;
            fillRect(px, H * 0.45, 6, 12, '#777');
            fillRect(px, H * 0.4, 6, 6, '#ddb088');
        }
    }

    function drawShot14(t) {
        // 아이 눈을 가리는 어른 / "집값 떨어진다"
        fillRect(0, 0, W, H, '#333');
        fillRect(0, H * 0.7, W, H * 0.3, '#555');
        // 어른 + 아이
        // 어른
        fillRect(80, H * 0.35, 10, 20, '#666');
        fillRect(80, H * 0.28, 10, 8, '#ddb088');
        // 손 (아이 눈 가리기)
        fillRect(100, H * 0.42, 8, 3, '#ddb088');
        // 아이
        fillRect(105, H * 0.4, 7, 12, '#88aadd');
        fillRect(105, H * 0.35, 7, 6, '#ffcc88');
        // 다른쪽 어른 - 말풍선
        fillRect(160, H * 0.35, 10, 20, '#555');
        fillRect(160, H * 0.28, 10, 8, '#ddb088');
        // 말풍선
        fillRect(140, H * 0.15, 70, 16, '#fff');
        drawPixelText('집값 떨어진다!', 175, H * 0.15 + 10, '#c00', 5);
    }

    function drawShot15(t) {
        // 웃고 있는 남자 클로즈업
        fillRect(0, 0, W, H, '#1a0a0a');
        drawCharacter(W/2, H/2 + 10, 5, { smile: true });
        // 피 얼룩 위쪽
        fillRect(W/2 - 30, H * 0.75, 60, 6, '#660018');
    }

    function drawShot16_iris(t) {
        // 아이리스 아웃
        fillRect(0, 0, W, H, '#1a0a0a');
        drawCharacter(W/2, H/2 + 10, 5, { smile: true });

        // 원형 마스크 축소
        const maxR = Math.sqrt(W*W + H*H) / 2;
        const progress = Math.min(t / 90, 1);
        const r = maxR * (1 - progress);

        ctx.save();
        ctx.globalCompositeOperation = 'destination-in';
        ctx.beginPath();
        ctx.arc(W/2, H/2, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 검은 바깥
        ctx.save();
        ctx.globalCompositeOperation = 'destination-over';
        fillRect(0, 0, W, H, '#000');
        ctx.restore();

        if (progress >= 1) {
            setTimeout(() => nextShot(), 500);
        }
    }

    function drawShot17_credits(t) {
        // 엔딩 크레딧
        fillRect(0, 0, W, H, '#000');
        const scrollY = H - t * 0.5;
        const credits = [
            '감독 · 기획',
            'hwanginkeom',
            '',
            '바이브코딩 Lab',
            '',
            '2026',
            '',
            '',
            'FIN'
        ];
        credits.forEach((line, i) => {
            const ly = scrollY + i * 24;
            if (ly > -10 && ly < H + 10) {
                drawPixelText(line, W/2, ly, '#fff', 6);
            }
        });
    }

    function drawShot18_audience(t) {
        // 영화관 관객들 박수
        fillRect(0, 0, W, H * 0.6, '#111');
        // 스크린 (작게)
        fillRect(W * 0.25, H * 0.05, W * 0.5, H * 0.3, '#222');
        drawPixelText('FIN', W/2, H * 0.2, '#666', 8);
        // 관객 좌석
        fillRect(0, H * 0.6, W, H * 0.4, '#1a1a1a');
        // 관객 머리들
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 8; col++) {
                const px = 20 + col * 30;
                const py = H * 0.62 + row * 25;
                fillRect(px, py, 8, 8, '#333');
                fillRect(px, py - 3, 8, 4, '#222');
                // 박수 손
                if (Math.floor(t / 6 + col + row) % 2 === 0) {
                    fillRect(px - 2, py + 6, 3, 3, '#ddb088');
                    fillRect(px + 8, py + 6, 3, 3, '#ddb088');
                }
            }
        }

        // 박수 소리 반복
        if (t % 30 === 0 && t > 0) playClap();

        // 버튼 표시
        if (t > 60) {
            document.getElementById('ending-btns').classList.add('show');
        }
    }

    // ==================== GAME LOGIC ====================
    function nextShot() {
        if (currentShot < shots.length - 1) {
            currentShot++;
            sceneStartTime = 0;
            animTime = 0;
            const shot = shots[currentShot];

            // 화면비 변경
            setAspect(shot.aspect);

            // 사운드
            if (shot.sound === 'alarm') playAlarm();
            if (shot.sound === 'siren') playSiren();
            if (shot.sound === 'clap') playClap();

            // 나레이션
            if (shot.narration) {
                narrationEl.textContent = shot.narration;
                narrationEl.classList.add('show');
            } else {
                narrationEl.classList.remove('show');
            }
        }
    }

    function startGame() {
        currentShot = 0;
        animTime = 0;
        sceneStartTime = 0;
        document.getElementById('ending-btns').classList.remove('show');
        document.getElementById('fullscreen-replay').classList.remove('show');
        setAspect(shots[0].aspect);
        narrationEl.classList.remove('show');
    }

    // 클릭 진행
    document.getElementById('game-container').addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON') return;
        initAudio();
        const shot = shots[currentShot];
        if (!shot.auto) {
            nextShot();
        }
    });

    // 엔딩 버튼
    document.getElementById('btn-replay').addEventListener('click', function(e) {
        e.stopPropagation();
        startGame();
    });

    document.getElementById('btn-exit').addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('ending-btns').classList.remove('show');
        document.getElementById('fullscreen-replay').classList.add('show');
    });

    document.getElementById('fullscreen-replay').addEventListener('click', function() {
        startGame();
    });

    // ==================== RENDER LOOP ====================
    function render() {
        requestAnimationFrame(render);
        ctx.clearRect(0, 0, W, H);

        const shot = shots[currentShot];
        if (shot && shot.draw) {
            shot.draw(animTime);
        }

        animTime++;
    }

    // 시작
    setAspect('16:4');
    render();
    </script>
</body>
</html>

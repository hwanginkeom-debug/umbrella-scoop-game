<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飛翔</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:100vh;cursor:pointer}
        #game-container{position:relative;background:#0a0a14;overflow:hidden;border:1px solid #222}
        canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
        #narration{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#eee;font-size:13px;font-family:monospace;text-align:center;max-width:85%;opacity:0;transition:opacity .6s;z-index:100;letter-spacing:0.5px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
        #narration.show{opacity:1}
        #ending-btns{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;gap:20px;z-index:300}
        #ending-btns.show{display:flex}
        #ending-btns button{font-family:monospace;font-size:12px;padding:12px 28px;background:#000;color:#fff;border:1px solid #555;cursor:pointer}
        #ending-btns button:hover{background:#fff;color:#000}
        #fullscreen-replay{position:fixed;inset:0;background:#000;display:none;flex-wrap:wrap;align-content:center;justify-content:center;z-index:9999;cursor:pointer;padding:20px;gap:10px;overflow:hidden}
        #fullscreen-replay.show{display:flex}
        #fullscreen-replay button{font-family:monospace;font-size:11px;padding:8px 18px;background:#000;color:#fff;border:1px solid #555;cursor:pointer}
        #fullscreen-replay button:hover{background:#fff;color:#000}
        .back-btn{position:fixed;top:8px;left:8px;z-index:10000;padding:4px 10px;background:transparent;color:#444;font-size:9px;font-family:monospace;text-decoration:none}
        .back-btn:hover{color:#aaa}
        #notice{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);color:#444;font-size:8px;font-family:monospace;z-index:10000;letter-spacing:.3px}
        #progress-bar{position:absolute;bottom:0;left:0;width:100%;height:6px;background:#111;z-index:200;display:flex;align-items:center}
        #progress-fill{height:4px;background:#c08558;transition:width .3s;margin:0 1px}
        #progress-dot{width:6px;height:6px;background:#fff;position:absolute;transition:left .3s}
        #progress-ticks{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:space-between;padding:0 2px}
        #progress-ticks span{width:1px;height:100%;background:#333}
    </style>
</head>
<body>
<a href="../bridge.html" class="back-btn">← BACK</a>

<div id="game-container">

<script>
// ===================== CONFIG =====================
const W=320,H=180;
const BLOCK=2;
const SAMPLE_W=Math.floor(W/BLOCK),SAMPLE_H=Math.floor(H/BLOCK);

// ===================== AUDIO ENGINE =====================
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new AudioCtx();}

let bgmNodes=[],bgmGain=null;
function stopBgm(){bgmNodes.forEach(n=>{try{n.stop();}catch(e){}});bgmNodes=[];}

function playBgm(type){
    initAudio();stopBgm();
    if(!type||type==='none') return;
    bgmGain=audioCtx.createGain();bgmGain.connect(audioCtx.destination);bgmGain.gain.value=0.04;
    
    if(type==='calm'){
        // 조용하고 선선한 앰비언트
        const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=180;
        const o2=audioCtx.createOscillator();o2.type='sine';o2.frequency.value=270;
        const g2=audioCtx.createGain();g2.gain.value=0.02;
        o.connect(bgmGain);o2.connect(g2);g2.connect(audioCtx.destination);
        o.start();o2.start();bgmNodes.push(o,o2);
    }else if(type==='footsteps'){
        // 뚜벅뚜벅 리듬
        bgmGain.gain.value=0.06;
        let step=0;
        const iv=setInterval(()=>{
            if(!audioCtx||bgmNodes.length===0){clearInterval(iv);return;}
            const b=audioCtx.createBuffer(1,audioCtx.sampleRate*.05,audioCtx.sampleRate);
            const d=b.getChannelData(0);
            for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4)*(step%2?.6:.4);
            const s=audioCtx.createBufferSource();s.buffer=b;s.connect(bgmGain);s.start();
            step++;
        },600);
        bgmNodes.push({stop:()=>clearInterval(iv)});
    }else if(type==='fresh'){
        // 파도소리 같은 신선한 사운드
        bgmGain.gain.value=0.035;
        const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=220;
        const lfo=audioCtx.createOscillator();lfo.frequency.value=0.15;
        const lfoG=audioCtx.createGain();lfoG.gain.value=30;
        lfo.connect(lfoG);lfoG.connect(o.frequency);
        o.connect(bgmGain);o.start();lfo.start();bgmNodes.push(o,lfo);
    }else if(type==='classic'){
        // 클래식 느낌 — 화음 패드
        bgmGain.gain.value=0.03;
        [261.6,329.6,392.0,523.2].forEach(freq=>{
            const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=freq;
            const g=audioCtx.createGain();g.gain.value=0.015;
            o.connect(g);g.connect(audioCtx.destination);o.start();bgmNodes.push(o);
        });
    }else if(type==='rain'){
        // 빗소리
        bgmGain.gain.value=0.05;
        const bufSize=audioCtx.sampleRate*2;
        const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*0.3;
        const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
        const filt=audioCtx.createBiquadFilter();filt.type='highpass';filt.frequency.value=800;
        src.connect(filt);filt.connect(bgmGain);src.start();bgmNodes.push(src);
    }else if(type==='quiet'){
        // 들릴듯 말듯한 잔잔한 소리
        bgmGain.gain.value=0.015;
        const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=150;
        o.connect(bgmGain);o.start();bgmNodes.push(o);
    }else if(type==='nature'){
        // 벌레소리 + 바람
        bgmGain.gain.value=0.03;
        const bufSize=audioCtx.sampleRate*2;
        const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*0.15;
        const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
        const filt=audioCtx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=3000;filt.Q.value=2;
        src.connect(filt);filt.connect(bgmGain);src.start();bgmNodes.push(src);
        // 벌레 chirp
        const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=4200;
        const g2=audioCtx.createGain();g2.gain.value=0.008;
        const lfo=audioCtx.createOscillator();lfo.frequency.value=8;
        const lfoG=audioCtx.createGain();lfoG.gain.value=0.008;
        lfo.connect(lfoG);lfoG.connect(g2.gain);
        o.connect(g2);g2.connect(audioCtx.destination);o.start();lfo.start();bgmNodes.push(o,lfo);
    }else if(type==='applause'){
        // 박수 + 신나는 쇼 엔딩 음악 (빠른 메이저 코드 진행)
        bgmGain.gain.value=0.05;
        // 박수 레이어
        const bufSize=audioCtx.sampleRate*2;
        const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<bufSize;i++) d[i]=(Math.random()*2-1)*0.25*(1+Math.sin(i/600)*.4);
        const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
        const filt=audioCtx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=1800;filt.Q.value=0.4;
        src.connect(filt);filt.connect(bgmGain);src.start();bgmNodes.push(src);
        // 신나는 멜로디 레이어 (빠른 메이저 아르페지오)
        const notes=[523,659,784,1047,784,659,523,659,784,1047,1318,1047,784,659];
        let ni=0;
        const melGain=audioCtx.createGain();melGain.gain.value=0.03;melGain.connect(audioCtx.destination);
        const playNote=()=>{
            if(!audioCtx||bgmNodes.length===0) return;
            const o=audioCtx.createOscillator();o.type='square';
            o.frequency.value=notes[ni%notes.length];
            const eg=audioCtx.createGain();eg.gain.value=0.03;
            eg.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.15);
            o.connect(eg);eg.connect(audioCtx.destination);
            o.start();o.stop(audioCtx.currentTime+0.15);
            ni++;
        };
        const melIv=setInterval(playNote,180);
        bgmNodes.push({stop:()=>clearInterval(melIv)});
        // 베이스라인
        const bass=audioCtx.createOscillator();bass.type='sawtooth';bass.frequency.value=130.8;
        const bassG=audioCtx.createGain();bassG.gain.value=0.02;
        bass.connect(bassG);bassG.connect(audioCtx.destination);bass.start();bgmNodes.push(bass);
    }else if(type==='melancholy'){
        // 침울하고 우울한 소리
        bgmGain.gain.value=0.025;
        const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=110;
        const o2=audioCtx.createOscillator();o2.type='sine';o2.frequency.value=138.6;
        o.connect(bgmGain);o2.connect(bgmGain);o.start();o2.start();bgmNodes.push(o,o2);
    }
}

function fadeBgm(){
    if(bgmGain){bgmGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+2);}
    setTimeout(stopBgm,2200);
}

// SFX
function playSfx(type){
    initAudio();
    if(type==='throw'){
        const b=audioCtx.createBuffer(1,audioCtx.sampleRate*.08,audioCtx.sampleRate);
        const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
        const s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=b;g.gain.value=.12;s.connect(g);g.connect(audioCtx.destination);s.start();
    }else if(type==='sigh'){
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=180;
        g.gain.value=.04;o.connect(g);g.connect(audioCtx.destination);o.start();
        g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+1.2);setTimeout(()=>o.stop(),1300);
    }else if(type==='impact'){
        const b=audioCtx.createBuffer(1,audioCtx.sampleRate*.15,audioCtx.sampleRate);
        const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5)*.8;
        const s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=b;g.gain.value=.2;s.connect(g);g.connect(audioCtx.destination);s.start();
    }else if(type==='crowd'){
        const b=audioCtx.createBuffer(1,audioCtx.sampleRate*.5,audioCtx.sampleRate);
        const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.2*(1+Math.sin(i/200)*.5);
        const s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=b;g.gain.value=.08;s.connect(g);g.connect(audioCtx.destination);s.start();
    }
}

const PALETTE=[
[26,26,46],[192,133,88],[204,51,51],[221,136,34],[221,204,51],
[68,136,204],[102,136,170],[136,85,68],[119,136,153],[255,255,255],
[40,40,60],[176,52,42],[236,90,46],[115,197,241],[120,179,94],
[64,91,53],[199,113,114],[234,209,239]
];

// ===================== SCENES =====================
const SCENES=[
{id:'s01_room_wake',img:'assets/s01_room_wake.png.jpeg',bgm:'calm',beats:[
 {type:'action',text:''},
 {type:'nar',text:'- 인생은 삶의 반복이다.'},
 {type:'nar',text:'- 아침은 지겨울 정도로 허기지고'},
 {type:'nar',text:'- 점심은 정신을 차리지 못할 정도로 숨가쁘며'},
 {type:'nar',text:'- 새벽은 언제 어두워질지도 모를 정도로 각박하고 길다.'}
],auto:8000},
{id:'s02_room_throw',img:'assets/s02_room_throw.jpeg',sfx:'throw',beats:[
 {type:'nar',text:'- 인생은 삶의 반복이다.'}
],auto:6000},
{id:'s03_room_sigh',img:'assets/s03_room_sigh.jpeg',sfx:'sigh',beats:[
 {type:'nar',text:'- 새 탄생의 빛을 보면 설탕물과 소금물 정도의 밀도 차이를 느낀다.'},
 {type:'nar',text:'- 혈류는 이럴 때만 야속하게 힘 있게 뛰지 않는다.'}
],auto:8000},
{id:'s04_hall_exit',img:'assets/s04_hall_exit.png',bgm:'footsteps',beats:[
 {type:'action',text:''}
],auto:6000},
{id:'s05_hall_title',img:'assets/s05_hall_title.jpeg',transition:'cut',beats:[
 {type:'action',text:''}
],auto:6000},
{id:'s06_hall_skygaze',img:'assets/s06_hall_skygaze.jpg',bgm:'fresh',beats:[
 {type:'action',text:''}
],auto:7000},
{id:'s07_eyes_closeup',img:'assets/s07_eyes_closeup.jpeg',beats:[
 {type:'nar',text:'- 하늘을 보며 눈망울을 치켜올린다.'}
],auto:7000},
{id:'s08_city_view',img:'assets/s08_city_view.jpg',beats:[
 {type:'nar',text:'- 개미집을 멀리서 보면 광활한 우주가 보인다.'}
],auto:8000},
{id:'s09_birds_float',img:'assets/s09_birds_float.jpeg',bgm:'classic',transition:'glitch',beats:[
 {type:'nar',text:'- 몸을 던지면 모이를 쪼러 온갖 새들이 나에게 몰려온다.'}
],auto:10000},
{id:'s10_crowd_sunset',img:'assets/s10_crowd_sunset.jpeg',transition:'glitch',beats:[
 {type:'nar',text:'- 오늘은 사람들에게 인사를 했다.'},
 {type:'nar',text:'- 반갑습니다'},
 {type:'nar',text:'- 고마워요'},
 {type:'nar',text:'- さよなら'}
],auto:7000},
{id:'s11_meadow_fall',img:'assets/s11_meadow_fall.jpeg',transition:'glitch',beats:[
 {type:'nar',text:'어 세상이 …',glitch:true}
],auto:7000},
{id:'s12_black_impact',img:'assets/s12_black_impact.png',bgm:'none',sfx:'impact',beats:[

],auto:5000},
{id:'s13_ground_body',img:'assets/s13_ground_body.jpeg',bgm:'rain',beats:[

],auto:8000},

],auto:6000},
{id:'s15_dark_rest',img:'assets/s15_dark_rest.jpg',bgm:'quiet',beats:[

],auto:8000},
{id:'s16_flowers_a',img:'assets/s16_flowers_a.jpeg',bgm:'nature',transition:'natural',beats:[

],auto:6000},
{id:'s17_flowers_b',img:'assets/s17_flowers_b.jpeg',transition:'natural',beats:[

],auto:6000},
{id:'s18_flowers_c',img:'assets/s18_flowers_c.jpeg',transition:'natural',beats:[

],auto:6000},
{id:'s19_flowers_field',img:'assets/s19_flowers_field.jpeg',bgm:'melancholy',transition:'natural',beats:[

],auto:8000},
{id:'s20_cinema_end',img:'assets/s20_cinema_end.jpeg',bgm:'applause',transition:'slide',beats:[

],auto:8000},
{id:'s21_iris_end',img:'assets/s21_iris_end.png',transition:'iris',beats:[

 {type:'action',text:''}
],auto:0}
];

// ===================== STATE =====================
let currentScene=0,currentBeat=0,animTime=0,sceneStartTime=0;
let pixelBlocks=null,nextPixelBlocks=null,transitioning=false,transProgress=0;

// ===================== CANVAS =====================
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const container=document.getElementById('game-container');
const narrationEl=document.getElementById('narration');

function resize(){
    const maxW=Math.min(window.innerWidth*.94,900);
    const maxH=window.innerHeight*.9;
    let w=maxW,h=w*(9/16);
    if(h>maxH){h=maxH;w=h*(16/9);}
    container.style.width=w+'px';container.style.height=h+'px';
    canvas.width=W;canvas.height=H;
}
resize();window.addEventListener('resize',resize);

// ===================== PIXEL ENGINE =====================
function imageToBlocks(img,callback){
    const oc=document.createElement('canvas');
    oc.width=SAMPLE_W;oc.height=SAMPLE_H;
    const octx=oc.getContext('2d');
    octx.drawImage(img,0,0,SAMPLE_W,SAMPLE_H);
    const raw=octx.getImageData(0,0,SAMPLE_W,SAMPLE_H);
    const blocks=new Uint8Array(SAMPLE_W*SAMPLE_H);
    for(let i=0;i<blocks.length;i++){
        const idx=i*4;
        const r=raw.data[idx],g=raw.data[idx+1],b=raw.data[idx+2];
        let minD=Infinity,best=0;
        for(let p=0;p<PALETTE.length;p++){
            const d=(r-PALETTE[p][0])**2+(g-PALETTE[p][1])**2+(b-PALETTE[p][2])**2;
            if(d<minD){minD=d;best=p;}
        }
        blocks[i]=best;
    }
    callback(blocks);
}

function loadSceneImage(sceneIdx,callback){
    const scene=SCENES[sceneIdx];
    if(!scene||!scene.img){callback(null);return;}
    const img=new Image();
    img.src=scene.img;
    img.onload=()=>imageToBlocks(img,callback);
    img.onerror=()=>callback(null);
}

// ===================== RENDER =====================
function renderBlocks(blocks,offsetFn){
    if(!blocks)return;
    for(let y=0;y<SAMPLE_H;y++){
        const ox=offsetFn?offsetFn(y,animTime):0;
        for(let x=0;x<SAMPLE_W;x++){
            const ci=blocks[y*SAMPLE_W+x];
            const c=PALETTE[ci];
            ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
            ctx.fillRect(x*BLOCK+ox,y*BLOCK,BLOCK,BLOCK);
        }
    }
}

function defaultOffset(y,t){
    return Math.sin(t*.02+y*.15)*Math.sin(t*.008)*2;
}

function render(){
    requestAnimationFrame(render);
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    
    if(currentScene>=SCENES.length) return;
    const scene=SCENES[currentScene];
    
    // s22: black + buttons
    if(scene.id==='s22_black_buttons'){
        document.getElementById('ending-btns').classList.add('show');
        return;
    }
    
    if(transitioning&&nextPixelBlocks){
        const t=transProgress;
        // transition effects
        if(scene.transition==='glitch'){
            renderBlocks(pixelBlocks,(y,at)=>defaultOffset(y,at)+(Math.random()-.5)*t*8);
            ctx.globalAlpha=t;
            renderBlocks(nextPixelBlocks,defaultOffset);
            ctx.globalAlpha=1;
        }else if(scene.transition==='iris'){
            // 이전 씬을 보여주면서 원형 마스크가 줄어듦 → 검은화면
            if(pixelBlocks) renderBlocks(pixelBlocks,defaultOffset);
            // 검은 원형 마스크 (바깥에서 안으로 닫힘)
            const maxR=Math.sqrt(W*W+H*H)/2;
            const r=maxR*(1-t);
            ctx.fillStyle='#000';
            ctx.beginPath();ctx.rect(0,0,W,H);
            ctx.moveTo(W/2+r,H/2);ctx.arc(W/2,H/2,r,0,Math.PI*2,true);
            ctx.fill();
            // 완전히 닫히면 다음 씬 표시
            if(t>0.95){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}
        }else if(scene.transition==='slide'){
            if(pixelBlocks) renderBlocks(pixelBlocks,defaultOffset);
            ctx.fillStyle='#000';ctx.fillRect(0,0,W,H*t);
            if(t>0.5){ctx.globalAlpha=(t-.5)*2;renderBlocks(nextPixelBlocks,defaultOffset);ctx.globalAlpha=1;}
        }else if(scene.transition==='natural'){
            if(pixelBlocks){ctx.globalAlpha=1-t;renderBlocks(pixelBlocks,defaultOffset);ctx.globalAlpha=1;}
            ctx.globalAlpha=t;renderBlocks(nextPixelBlocks,defaultOffset);ctx.globalAlpha=1;
        }else{
            renderBlocks(nextPixelBlocks,defaultOffset);
        }
        transProgress+=(SCENES[currentScene]&&SCENES[currentScene].transition==='iris')?0.012:0.02;
        if(transProgress>=1){transitioning=false;pixelBlocks=nextPixelBlocks;nextPixelBlocks=null;}
    }else{
        renderBlocks(pixelBlocks,defaultOffset);
    }
    animTime++;
}

// ===================== NARRATION =====================
function updateProgress(){
    const total=SCENES.length;
    const pct=((currentScene)/Math.max(total-1,1))*100;
    document.getElementById('progress-fill').style.width=pct+'%';
    document.getElementById('progress-dot').style.left=Math.min(pct,98)+'%';
}

function showNarration(text){
    if(!text){narrationEl.classList.remove('show');return;}
    narrationEl.textContent=text;
    narrationEl.classList.add('show');
}

// ===================== SCENE CONTROL =====================
function goToScene(idx){
    if(idx>=SCENES.length) return;
    currentScene=idx;currentBeat=0;
    sceneStartTime=Date.now();
    const scene=SCENES[idx];
    
    document.getElementById('ending-btns').classList.remove('show');
    
    // Show first beat narration
    if(scene.beats&&scene.beats.length>0){
        const beat=scene.beats[0];
        showNarration(beat.type==='nar'?beat.text:'');
    }else{
        showNarration('');
    }
    
    // BGM
    initAudio();
    if(scene.bgm) playBgm(scene.bgm);
    // SFX
    if(scene.sfx) playSfx(scene.sfx);
    
    updateProgress();
    // Load image
    loadSceneImage(idx,(blocks)=>{
        if(scene.transition&&scene.transition!=='cut'&&pixelBlocks){
            nextPixelBlocks=blocks;
            transitioning=true;transProgress=0;
        }else{
            pixelBlocks=blocks;
        }
    });
    
    // Auto advance timer
    if(scene.auto&&scene.auto>0){
        clearTimeout(window._autoTimer);
        window._autoTimer=setTimeout(()=>advance(),scene.auto);
    }
}

function advance(){
    clearTimeout(window._autoTimer);
    const scene=SCENES[currentScene];
    if(!scene) return;
    
    // Next beat in current scene
    if(currentBeat<scene.beats.length-1){
        currentBeat++;
        const beat=scene.beats[currentBeat];
        showNarration(beat.type==='nar'?beat.text:'');
        // Auto for next beat
        if(scene.auto&&scene.auto>0){
            window._autoTimer=setTimeout(()=>advance(),scene.auto);
        }
    }else{
        // Next scene
        if(currentScene<SCENES.length-1){
            goToScene(currentScene+1);
        }
    }
}

function startGame(){
    currentScene=0;currentBeat=0;pixelBlocks=null;
    document.getElementById('ending-btns').classList.remove('show');
    document.getElementById('fullscreen-replay').classList.remove('show');
    narrationEl.classList.remove('show');
    goToScene(0);
}

// ===================== INTERACTION =====================
container.addEventListener('click',(e)=>{
    if(e.target.tagName==='BUTTON') return;
    initAudio();
    advance();
});

document.getElementById('btn-replay').addEventListener('click',(e)=>{
    e.stopPropagation();startGame();
});

document.getElementById('btn-exit').addEventListener('click',(e)=>{
    e.stopPropagation();
    document.getElementById('ending-btns').classList.remove('show');
    const el=document.getElementById('fullscreen-replay');
    el.innerHTML='';el.classList.add('show');
    let count=0;
    function addBtn(){
        const b=document.createElement('button');
        b.textContent='다시보기 ▶';
        b.addEventListener('click',(ev)=>{ev.stopPropagation();startGame();});
        el.appendChild(b);count++;
        if(count<80) setTimeout(addBtn,Math.max(300-count*3,30));
    }
    addBtn();
});

document.getElementById('fullscreen-replay').addEventListener('click',startGame);

// ===================== START =====================
// 페이지 로드시 오디오 초기화 시도 (일부 브라우저는 유저 인터랙션 필요)
document.addEventListener('click',function once(){initAudio();document.removeEventListener('click',once);},{ once:true });
render();
goToScene(0);
</script>

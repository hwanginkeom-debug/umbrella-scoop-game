<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 무비</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            cursor: pointer;
        }

        #game-container {
            position: relative;
            background: #000;
            overflow: hidden;
            transition: width 1.2s ease, height 1.2s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #narration {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            padding: 8px 16px;
            font-size: 11px;
            font-family: monospace;
            line-height: 1.6;
            text-align: center;
            max-width: 85%;
            display: none;
            z-index: 100;
            text-shadow: 0 0 4px #fff;
            letter-spacing: 1px;
        }

        #narration.show { display: block; }

        #click-hint {
            position: absolute;
            bottom: 4px;
            right: 8px;
            color: rgba(255,255,255,0.3);
            font-size: 9px;
            font-family: monospace;
            z-index: 100;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        #ending-btns {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 20px;
            z-index: 300;
        }

        #ending-btns.show { display: flex; }

        #ending-btns button {
            font-family: monospace;
            font-size: 11px;
            padding: 10px 24px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            cursor: pointer;
            letter-spacing: 1px;
        }

        #ending-btns button:hover {
            background: #fff;
            color: #000;
        }

        #fullscreen-replay {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }

        #fullscreen-replay.show { display: flex; }

        #fullscreen-replay span {
            font-family: monospace;
            font-size: 14px;
            color: #fff;
            border: 1px solid #fff;
            padding: 16px 32px;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .back-btn {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 10000;
            padding: 4px 10px;
            background: #000;
            color: #555;
            font-size: 9px;
            font-family: monospace;
            text-decoration: none;
            border: 1px solid #333;
        }

        .back-btn:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>
    <a href="../bridge.html" class="back-btn">← BACK</a>

    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="narration"></div>
        <div id="click-hint">▶</div>
        <div id="ending-btns">
            <button id="btn-replay">다시보기</button>
            <button id="btn-exit">나가기</button>
        </div>
    </div>

    <div id="fullscreen-replay">
        <span>다시보기</span>
    </div>

    <script>
    // ==================== AUDIO ====================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

    function playAlarm() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = 660; osc.type = 'square';
        gain.gain.value = 0.08;
        osc.start();
        let count = 0;
        const iv = setInterval(() => {
            osc.frequency.value = count % 2 === 0 ? 660 : 440;
            count++;
            if (count > 6) { clearInterval(iv); gain.gain.value = 0; osc.stop(); }
        }, 150);
    }

    function playSiren() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sawtooth'; gain.gain.value = 0.06;
        osc.start();
        let t = 0;
        const iv = setInterval(() => {
            osc.frequency.value = 300 + Math.sin(t * 3) * 200;
            t += 0.05;
        }, 30);
        setTimeout(() => { clearInterval(iv); gain.gain.value = 0; osc.stop(); }, 2500);
    }

    function playClap() {
        initAudio();
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = buf; src.connect(gain); gain.connect(audioCtx.destination);
        gain.gain.value = 0.2; src.start();
    }

    // ==================== CANVAS ====================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const narrationEl = document.getElementById('narration');

    let W = 192, H = 48;
    canvas.width = W; canvas.height = H;

    function setAspect(ratio) {
        const maxW = Math.min(window.innerWidth * 0.92, 800);
        const maxH = window.innerHeight * 0.88;
        let w, h;
        if (ratio === '16:4') {
            w = maxW; h = w * (4/16);
            W = 192; H = 48;
        } else if (ratio === '3:4') {
            h = maxH; w = h * (3/4);
            W = 120; H = 160;
        } else {
            const s = Math.min(maxW, maxH);
            w = s; h = s;
            W = 128; H = 128;
        }
        container.style.width = w + 'px';
        container.style.height = h + 'px';
        canvas.width = W; canvas.height = H;
    }

    // FAITH 스타일 — 극도로 미니멀, 1-2색, 블록 픽셀
    function px(x, y, w, h, color) {
        ctx.fillStyle = color || '#fff';
        ctx.fillRect(Math.floor(x), Math.floor(y), w || 1, h || 1);
    }

    function text(str, x, y, size, color) {
        ctx.fillStyle = color || '#fff';
        ctx.font = (size || 5) + 'px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(str, x, y);
    }

    // FAITH 스타일 캐릭터 — 단색, 극도로 단순
    function drawMan(x, y, opts = {}) {
        const { lying, arms, sleeping } = opts;
        if (lying) {
            // 누워있는 모습
            px(x - 6, y, 12, 3, '#fff'); // 몸
            px(x + 7, y, 3, 3, '#fff');  // 머리
            return;
        }
        // 머리
        px(x - 1, y - 8, 3, 3, '#fff');
        // 몸
        px(x, y - 5, 1, 5, '#fff');
        // 팔
        if (arms === 'up') {
            px(x - 2, y - 7, 1, 3, '#fff');
            px(x + 2, y - 7, 1, 3, '#fff');
        } else if (arms === 'out') {
            px(x - 3, y - 4, 3, 1, '#fff');
            px(x + 1, y - 4, 3, 1, '#fff');
        } else {
            px(x - 2, y - 4, 1, 3, '#fff');
            px(x + 2, y - 4, 1, 3, '#fff');
        }
        // 다리
        px(x - 1, y, 1, 3, '#fff');
        px(x + 1, y, 1, 3, '#fff');
        // 눈 (닫힘)
        if (sleeping) {
            px(x - 1, y - 7, 1, 1, '#000');
            px(x + 1, y - 7, 1, 1, '#000');
        }
    }

    function drawBird(x, y, frame) {
        px(x, y, 2, 1, '#fff');
        if (frame % 2 === 0) {
            px(x - 1, y - 1, 1, 1, '#fff');
            px(x + 2, y - 1, 1, 1, '#fff');
        } else {
            px(x - 1, y + 1, 1, 1, '#fff');
            px(x + 2, y + 1, 1, 1, '#fff');
        }
    }

    function drawFlower(x, y) {
        px(x, y, 1, 3, '#fff');
        px(x - 1, y - 1, 3, 1, '#fff');
        px(x, y - 2, 1, 1, '#fff');
    }

    // ==================== SHOTS ====================
    let currentShot = 0;
    let animTime = 0;

    const shots = [
        // PART 1 — 일상 (16:4)
        { aspect: '16:4', draw: shot_bed, narration: null, sound: null },
        { aspect: '16:4', draw: shot_alarm, narration: null, sound: 'alarm' },
        { aspect: '16:4', draw: shot_oh_no, narration: '"조졌네…"', sound: null },
        { aspect: '16:4', draw: shot_narration, narration: '[나레이션] 남자는 지각을 했습니다', sound: null },
        { aspect: '16:4', draw: shot_running, narration: null, sound: null },
        { aspect: '16:4', draw: shot_hallway, narration: null, sound: null },
        { aspect: '16:4', draw: shot_closeup, narration: null, sound: null },
        { aspect: '16:4', draw: shot_transition1, narration: null, sound: null, auto: true },
        // PART 2 — 비상 (3:4)
        { aspect: '3:4', draw: shot_window, narration: null, sound: null },
        { aspect: '3:4', draw: shot_sky_dance, narration: null, sound: null },
        { aspect: '3:4', draw: shot_neighbors, narration: null, sound: null },
        { aspect: '3:4', draw: shot_ground, narration: null, sound: null },
        { aspect: '3:4', draw: shot_transition2, narration: null, sound: 'siren', auto: true },
        // PART 3 — 착지 (1:1)
        { aspect: '1:1', draw: shot_fallen, narration: null, sound: null },
        { aspect: '1:1', draw: shot_crowd, narration: null, sound: null },
        { aspect: '1:1', draw: shot_smile, narration: null, sound: null },
        { aspect: '1:1', draw: shot_iris, narration: null, sound: null, auto: true },
        { aspect: '1:1', draw: shot_credits, narration: null, sound: null },
        { aspect: '1:1', draw: shot_audience, narration: null, sound: 'clap' },
    ];

    // === PART 1 ===
    function shot_bed(t) {
        // 1인칭 — 눈을 뜸
        const open = Math.min(t / 40, 1);
        const barH = Math.floor(H * 0.5 * (1 - open));
        // 천장
        ctx.fillStyle = '#111';
        ctx.fillRect(0, barH, W, H - barH * 2);
        // 이불 라인
        px(0, H - barH - 5, W, 1, '#333');
        // 눈 뜨기 바
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, barH);
        ctx.fillRect(0, H - barH, W, barH);
    }

    function shot_alarm(t) {
        // 핸드폰 화면
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 폰
        const px0 = W/2 - 8, py0 = H/2 - 12;
        px(px0, py0, 16, 24, '#222');
        px(px0 + 1, py0 + 1, 14, 22, '#111');
        // 시간
        const blink = Math.floor(t / 10) % 2;
        text('8:47', W/2, H/2 + 2, 6, blink ? '#f44' : '#800');
        // 진동
        if (Math.floor(t / 4) % 2) ctx.translate(0.5, 0);
    }

    function shot_oh_no(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        drawMan(W/2, H/2 + 4);
        // 땀
        if (t > 10) px(W/2 + 4, H/2 - 8, 1, 2, '#fff');
    }

    function shot_narration(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 시계
        const cx = W/2, cy = H/2;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.stroke();
        // 바늘
        px(cx, cy, 1, -8, '#fff');
        px(cx, cy - 8, 1, 1, '#fff');
        px(cx, cy, 6, 1, '#fff');
        px(cx + 5, cy, 1, 1, '#fff');
    }

    function shot_running(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 바닥 라인
        px(0, H - 6, W, 1, '#333');
        // 달리는 캐릭터
        const runX = 30 + (t * 0.3) % 20;
        const bob = Math.floor(t / 4) % 2;
        drawMan(runX, H - 8 - bob, { arms: t % 8 < 4 ? 'out' : undefined });
        // 빵 (입 옆에 작은 점)
        px(runX + 2, H - 8 - bob - 7, 2, 1, '#fff');
        // 건물 실루엣
        for (let i = 0; i < 6; i++) {
            const bh = 10 + (i * 7) % 15;
            px(i * 32, H - 6 - bh, 20, bh, '#111');
        }
    }

    function shot_hallway(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 복도 — 수평선
        px(0, H * 0.3, W, 1, '#333');
        px(0, H * 0.7, W, 1, '#333');
        // 난간 기둥
        for (let i = 0; i < 12; i++) {
            px(i * 16 + 4, H * 0.3, 1, H * 0.4, '#222');
        }
        // 캐릭터 걷기
        const walkX = 20 + (t * 0.5) % (W - 40);
        drawMan(walkX, H * 0.65);
    }

    function shot_closeup(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 큰 얼굴 — FAITH 스타일
        const cx = W/2, cy = H/2;
        // 머리 윤곽
        px(cx - 6, cy - 8, 12, 14, '#fff');
        // 눈 (빛나는)
        px(cx - 3, cy - 3, 2, 2, '#000');
        px(cx + 2, cy - 3, 2, 2, '#000');
        // 눈 하이라이트
        if (Math.floor(t / 8) % 3 !== 0) {
            px(cx - 3, cy - 3, 1, 1, '#fff');
            px(cx + 2, cy - 3, 1, 1, '#fff');
        }
    }

    function shot_transition1(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        if (t > 20 && t < 50) {
            text('...', W/2, H/2 + 2, 6, '#444');
        }
        if (t > 60) nextShot();
    }

    // === PART 2 ===
    function shot_window(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 창틀
        px(10, 8, W - 20, H - 16, '#222');
        px(12, 10, W - 24, H - 20, '#000');
        // 십자 창살
        px(W/2, 10, 1, H - 20, '#222');
        px(12, H/2, W - 24, 1, '#222');
        // 새
        for (let i = 0; i < 3; i++) {
            const bx = 30 + i * 25 + Math.sin(t * 0.05 + i) * 5;
            const by = 25 + Math.sin(t * 0.03 + i * 2) * 8;
            drawBird(bx, by, Math.floor(t / 8 + i));
        }
        // 하늘 — 몇개의 점 (별처럼)
        for (let i = 0; i < 8; i++) {
            px(20 + i * 12, 15 + (i * 7) % 20, 1, 1, '#333');
        }
    }

    function shot_sky_dance(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 캐릭터 (하늘에)
        const floatY = H * 0.4 + Math.sin(t * 0.04) * 8;
        drawMan(W/2, floatY, { arms: 'up' });
        // 새들 원형
        for (let i = 0; i < 6; i++) {
            const a = t * 0.03 + i * (Math.PI * 2 / 6);
            const bx = W/2 + Math.cos(a) * 30;
            const by = floatY - 5 + Math.sin(a) * 15;
            drawBird(bx, by, Math.floor(t / 6 + i));
        }
        // 구름 (점선)
        for (let i = 0; i < 4; i++) {
            px(10 + i * 30, 10 + i * 3, 8, 1, '#222');
        }
    }

    function shot_neighbors(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 아파트 벽 — 격자
        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 3; col++) {
                const wx = 15 + col * 35, wy = 8 + row * 30;
                px(wx, wy, 20, 18, '#111');
                // 창문 안 주민
                if ((row + col) % 2 === 0) {
                    drawMan(wx + 10, wy + 12);
                    // 손 흔들기
                    if (Math.floor(t / 12) % 2 === 0) {
                        px(wx + 13, wy + 5, 1, 2, '#fff');
                    }
                }
            }
        }
        // 떨어지는 캐릭터
        const fy = 10 + (t * 0.8) % (H - 20);
        drawMan(W/2 + 5, fy, { arms: 'out' });
    }

    function shot_ground(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 바닥 라인
        px(0, H - 10, W, 1, '#333');
        // 풀/꽃
        for (let i = 0; i < 8; i++) {
            drawFlower(10 + i * 14, H - 12);
        }
        // 벌레 (작은 점)
        for (let i = 0; i < 5; i++) {
            const bx = 20 + i * 20 + Math.sin(t * 0.08 + i) * 3;
            px(bx, H - 8, 2, 1, '#fff');
            px(bx + 2, H - 9, 1, 1, '#fff');
        }
        // 캐릭터 (바닥 근처)
        drawMan(W/2, H - 14, { arms: 'out' });
    }

    function shot_transition2(t) {
        // 빨/파 깜빡
        const flash = Math.floor(t / 6) % 2;
        ctx.fillStyle = flash ? '#300' : '#003';
        ctx.fillRect(0, 0, W, H);
        if (t > 50) nextShot();
    }

    // === PART 3 ===
    function shot_fallen(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 바닥
        px(0, H - 15, W, 1, '#333');
        // 캐릭터 누워있음
        drawMan(W/2, H - 18, { lying: true });
        // 피 — 몇 픽셀
        px(W/2 + 8, H - 16, 4, 2, '#800');
        px(W/2 + 6, H - 14, 6, 1, '#600');
        // 주변 사람들 (서있음)
        for (let i = 0; i < 6; i++) {
            drawMan(20 + i * 16, H - 30);
        }
    }

    function shot_crowd(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 어른 + 아이 (눈 가림)
        drawMan(35, H * 0.5);
        // 손을 뻗어 아이 눈 가리기
        px(40, H * 0.5 - 5, 5, 1, '#fff');
        // 아이 (작게)
        px(46, H * 0.5 - 4, 2, 2, '#fff');
        px(46, H * 0.5 - 2, 1, 3, '#fff');
        px(45, H * 0.5 + 1, 1, 2, '#fff');
        px(47, H * 0.5 + 1, 1, 2, '#fff');

        // 말풍선
        px(70, H * 0.25, 45, 12, '#fff');
        text('집값 떨어진다!', 92, H * 0.25 + 8, 5, '#000');
        // 말하는 어른
        drawMan(85, H * 0.5);
    }

    function shot_smile(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 큰 얼굴 클로즈업 — 웃는
        const cx = W/2, cy = H/2;
        px(cx - 10, cy - 12, 20, 22, '#fff');
        // 눈
        px(cx - 5, cy - 5, 3, 3, '#000');
        px(cx + 3, cy - 5, 3, 3, '#000');
        // 웃는 입 — 곡선 대신 계단
        px(cx - 4, cy + 4, 8, 1, '#000');
        px(cx - 5, cy + 3, 1, 1, '#000');
        px(cx + 4, cy + 3, 1, 1, '#000');
    }

    function shot_iris(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 웃는 얼굴 (작아짐)
        const cx = W/2, cy = H/2;
        const progress = Math.min(t / 80, 1);
        const r = Math.floor((1 - progress) * 60);

        if (r > 0) {
            // 얼굴 중앙
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            // 얼굴
            px(cx - 10, cy - 12, 20, 22, '#fff');
            px(cx - 5, cy - 5, 3, 3, '#000');
            px(cx + 3, cy - 5, 3, 3, '#000');
            px(cx - 4, cy + 4, 8, 1, '#000');
            px(cx - 5, cy + 3, 1, 1, '#000');
            px(cx + 4, cy + 3, 1, 1, '#000');
            ctx.restore();
        }

        if (progress >= 1) setTimeout(() => nextShot(), 800);
    }

    function shot_credits(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        const lines = ['감독 · 기획', '', 'hwanginkeom', '', '바이브코딩 Lab', '', '2026', '', '', 'FIN'];
        const scrollY = H - t * 0.3;
        lines.forEach((line, i) => {
            const ly = scrollY + i * 14;
            if (ly > -8 && ly < H + 8) {
                text(line, W/2, ly, 5, '#fff');
            }
        });
    }

    function shot_audience(t) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        // 스크린
        px(W * 0.2, 5, W * 0.6, H * 0.3, '#111');
        text('FIN', W/2, H * 0.15 + 3, 6, '#333');
        // 관객 머리들
        for (let row = 0; row < 4; row++) {
            for (let col = 0; col < 7; col++) {
                const hx = 10 + col * 16;
                const hy = H * 0.5 + row * 14;
                px(hx, hy, 4, 4, '#fff');
                // 박수 손
                if (Math.floor(t / 5 + col + row) % 2 === 0) {
                    px(hx - 1, hy + 4, 2, 1, '#fff');
                    px(hx + 3, hy + 4, 2, 1, '#fff');
                }
            }
        }
        // 박수 소리
        if (t % 25 === 0 && t > 0 && t < 150) playClap();
        // 버튼 표시
        if (t > 80) document.getElementById('ending-btns').classList.add('show');
    }

    // ==================== LOGIC ====================
    function nextShot() {
        if (currentShot < shots.length - 1) {
            currentShot++;
            animTime = 0;
            const shot = shots[currentShot];
            setAspect(shot.aspect);
            if (shot.sound === 'alarm') playAlarm();
            if (shot.sound === 'siren') playSiren();
            if (shot.sound === 'clap') playClap();
            if (shot.narration) {
                narrationEl.textContent = shot.narration;
                narrationEl.classList.add('show');
            } else {
                narrationEl.classList.remove('show');
            }
        }
    }

    function startGame() {
        currentShot = 0;
        animTime = 0;
        document.getElementById('ending-btns').classList.remove('show');
        document.getElementById('fullscreen-replay').classList.remove('show');
        narrationEl.classList.remove('show');
        setAspect(shots[0].aspect);
    }

    container.addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON') return;
        initAudio();
        if (!shots[currentShot].auto) nextShot();
    });

    document.getElementById('btn-replay').addEventListener('click', function(e) {
        e.stopPropagation();
        startGame();
    });

    document.getElementById('btn-exit').addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('ending-btns').classList.remove('show');
        document.getElementById('fullscreen-replay').classList.add('show');
    });

    document.getElementById('fullscreen-replay').addEventListener('click', startGame);

    // ==================== RENDER ====================
    function render() {
        requestAnimationFrame(render);
        ctx.clearRect(0, 0, W, H);
        const shot = shots[currentShot];
        if (shot && shot.draw) shot.draw(animTime);
        animTime++;
    }

    setAspect('16:4');
    render();
    </script>
</body>
</html>

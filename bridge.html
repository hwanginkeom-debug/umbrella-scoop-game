<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOHOOAN SPACE</title>
<link rel="icon" href="./파비콘.jpg" type="image/jpeg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#111111; overflow:hidden; font-family:-apple-system,sans-serif; }
  #hint {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,0.3); font-size:10px; letter-spacing:2px;
    pointer-events:none; animation:fh 4s forwards;
  }
  @keyframes fh{0%,60%{opacity:1}100%{opacity:0}}
  #label {
    position:fixed; bottom:60px; left:50%; transform:translateX(-50%);
    text-align:center; pointer-events:none; transition:opacity 0.3s;
  }
  #label .title { color:#fff; font-size:16px; font-weight:600; letter-spacing:0.5px; }
  #label .desc  { color:rgba(255,255,255,0.5); font-size:11px; margin-top:4px; }
  #label .date  { color:rgba(255,255,255,0.25); font-size:9px; margin-top:6px; letter-spacing:1px; }
</style>
</head>
<body>

<div id="label" style="opacity:0">
  <div class="title" id="lbl-title"></div>
  <div class="desc" id="lbl-desc"></div>
  <div class="date" id="lbl-date"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var projects = [
  { title:'굿바이 키로', desc:'할루시네이션과 싸워보세요', path:'./0730_fluid-icon/index.html', date:'2026.08.03', bg:'#0a0010', accent:'#cc88ff', thumb:'./썸네일/굿바이-키로.jpg' },
  { title:'자유', desc:'구체적이지 않고 겉보기에만 그럴싸한 자유는 언젠가 사라집니다.', path:'./0803_free/jayu-voxel-drop_2.html', date:'2026.07.30', bg:'#1a1a2e', accent:'#e8e0ff', thumb:'./썸네일/자유.jpg' },
  { title:'인간은 에일리언', desc:'외계인의 입장에서 지구인들을 바라보세요', path:'./0730_ alien-fluid-reveal_3/alien-fluid-reveal_3.html', date:'2026.07.30', bg:'#050a18', accent:'#4aefcc', thumb:'./썸네일/인간은-에일리언.jpg' },
  { title:'원두 월드', desc:'커피를 볶고 원두 향을 상상하세요', path:'./0729_coffee_poster/index.html', date:'2026.07.29', bg:'#5c2a08', accent:'#c47a3a', thumb:'./썸네일/원두-월드.jpg' },
  { title:'$$$인생역전드루와$$$', desc:'집에서도 할 수 있는 부업입니다', path:'./0728_자판기/index.html', date:'2026.07.28', bg:'#0a0a14', accent:'#ffdd44', thumb:'./썸네일/인생역전드루와.jpg' },
  { title:'김밥천국', desc:'무슨 김밥을 좋아해?', path:'./0727_kimbap/index3d.html', date:'2026.07.27', bg:'#1a0f08', accent:'#66cc44', thumb:'./썸네일/김밥천국.jpg' },
  { title:'비상', desc:'오늘도 똑같은 하루였다', path:'./0724_interactive_movie/index.html', date:'2026.07.24', bg:'#0a0a14', accent:'#ffffff', thumb:'./썸네일/비상.jpg' },
  { title:'어금니 과일', desc:'누구나 어금니에 조금씩 과일을 숨겨둔다', path:'./0723_vibe3/index.html', date:'2026.07.23', bg:'#0a0a0a', accent:'#cc1133', thumb:'./썸네일/어금니-과일.jpg' },
  { title:'집샌물샌', desc:'클릭하여 비에 잠기는 집을 구하라', path:'./index.html', date:'2026.07.16', bg:'#1a1a2e', accent:'#3388ff', thumb:'./썸네일/집샌물샌.jpg' },
];

var W = window.innerWidth, H = window.innerHeight;
var renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(W,H);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 100);
camera.position.set(0, 0, 7);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
// 우주 별 배경 고정
var starGeo = new THREE.BufferGeometry();
var starArr = new Float32Array(3000);
for(var si=0;si<3000;si+=3){starArr[si]=(Math.random()-0.5)*200;starArr[si+1]=(Math.random()-0.5)*200;starArr[si+2]=(Math.random()-0.5)*100-20;}
starGeo.setAttribute('position',new THREE.BufferAttribute(starArr,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:0.06,transparent:true,opacity:0.7})));
var nebGeo=new THREE.BufferGeometry();var nebArr=new Float32Array(400);
for(var ni=0;ni<400;ni+=3){nebArr[ni]=(Math.random()-0.5)*80;nebArr[ni+1]=(Math.random()-0.5)*80;nebArr[ni+2]=(Math.random()-0.5)*40-20;}
nebGeo.setAttribute('position',new THREE.BufferAttribute(nebArr,3));
scene.add(new THREE.Points(nebGeo,new THREE.PointsMaterial({color:0x6644aa,size:0.28,transparent:true,opacity:0.15})));
scene.background = new THREE.Color(0x111111);
var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(3, 5, 5);
scene.add(dirLight);
var rimLight = new THREE.DirectionalLight(0xaabbff, 0.3);
rimLight.position.set(-4, 2, -3);
scene.add(rimLight);

var CARD_W = 2.8, CARD_H = 1.75;
var SPREAD = 3.2;
var cards = [];
var targetX = 0, currentX = 0;
var dragging = false, dragStartX = 0, dragDeltaX = 0;
var hoveredIdx = -1;

// 플레이스홀더 텍스처 생성
function makeTexture(p) {
  var c = document.createElement('canvas');
  c.width = 800; c.height = 500;
  var ctx = c.getContext('2d');
  // 배경
  var grd = ctx.createLinearGradient(0,0,800,500);
  grd.addColorStop(0, p.bg);
  grd.addColorStop(1, shadeHex(p.bg, 30));
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,800,500);
  // 글로우
  var rad = ctx.createRadialGradient(500,200,0,500,200,400);
  rad.addColorStop(0, p.accent+'55');
  rad.addColorStop(1, 'transparent');
  ctx.fillStyle = rad;
  ctx.fillRect(0,0,800,500);
  // 노이즈
  for(var i=0;i<120;i++){ctx.fillStyle='rgba(255,255,255,0.015)';ctx.fillRect(Math.random()*800,Math.random()*500,Math.random()*80+5,Math.random()*80+5);}
  // 제목
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.font = 'bold 64px -apple-system,sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(p.title, 48, 420);
  // 날짜
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = '18px monospace';
  ctx.fillText(p.date, 48, 460);
  // 악센트 라인
  ctx.fillStyle = p.accent;
  ctx.fillRect(48, 48, 3, 80);
  var tex = new THREE.CanvasTexture(c);
  // 실제 썸네일 있으면 덮어쓰기
  var img = new Image();
  img.onload = function(){tex.image=img;tex.needsUpdate=true;};
  img.src = p.thumb;
  return tex;
}

function shadeHex(hex, amt) {
  var r=parseInt(hex.slice(1,3)||'00',16),g=parseInt(hex.slice(3,5)||'00',16),b=parseInt(hex.slice(5,7)||'00',16);
  return '#'+[r,g,b].map(function(v){return Math.min(255,v+amt).toString(16).padStart(2,'0');}).join('');
}

// 카드 메쉬 생성
projects.forEach(function(p, i) {
  var geo = new THREE.PlaneGeometry(CARD_W, CARD_H, 1, 1);
  var tex = makeTexture(p);
  var mat = new THREE.MeshStandardMaterial({map:tex, side:THREE.FrontSide});
  var mesh = new THREE.Mesh(geo, mat);
  // 뒷면 (무지갯빛 반짝이)
  var backMat = new THREE.MeshStandardMaterial({
    color: 0x111111,
    emissive: new THREE.Color(0.1, 0.05, 0.2),
    roughness: 0.1,
    metalness: 0.9
  });
  var backGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);
  var back = new THREE.Mesh(backGeo, backMat);
  back.rotation.y = Math.PI;
  back.position.z = -0.005;
  var group = new THREE.Group();
  group.add(mesh);
  group.add(back);
  group.userData = {idx: i, project: p};
  scene.add(group);
  cards.push(group);
});

// 카드 위치 계산
function layoutCards(offset) {
  cards.forEach(function(g, i) {
    var relF = i - offset; // offset=0이면 카드0이 중앙, offset=1이면 카드1이 중앙
    var angle = -relF * 0.35; // 오른쪽 카드는 왼쪽으로 기울어짐
    var tx = relF * SPREAD;
    var tz = -Math.abs(relF) * 1.2;
    g.position.x += (tx - g.position.x) * 0.1;
    g.position.z += (tz - g.position.z) * 0.1;
    g.position.y += (0 - g.position.y) * 0.1;
    g.rotation.y += (angle - g.rotation.y) * 0.1;
    var sc = 1 - Math.min(Math.abs(relF) * 0.08, 0.3);
    g.scale.setScalar(sc + (g.scale.x - sc) * 0.9);
  });
  var fi = Math.round(offset);
  fi = Math.max(0, Math.min(projects.length-1, fi));
  if (fi !== hoveredIdx) {
    hoveredIdx = fi;
    document.getElementById('lbl-title').textContent = projects[fi].title;
    document.getElementById('lbl-desc').textContent = projects[fi].desc;
    document.getElementById('lbl-date').textContent = projects[fi].date;
    document.getElementById('label').style.opacity = '1';
  }
}

// 입력
// 호버 포인트 라이트
var hoverLight = new THREE.PointLight(0xffffff, 0, 8);
scene.add(hoverLight);
var hoverRay = new THREE.Raycaster();
var hoverMv = new THREE.Vector2();
var hoverGroup = null;
var hoverTarget = 0;

renderer.domElement.addEventListener('mousemove', function(e) {
  hoverMv.x = (e.clientX/W)*2-1;
  hoverMv.y = -(e.clientY/H)*2+1;
  hoverRay.setFromCamera(hoverMv, camera);
  var meshes = [];
  cards.forEach(function(g){ g.children.forEach(function(m){ if(m.isMesh) meshes.push(m); }); });
  var hits = hoverRay.intersectObjects(meshes);
  if (hits.length > 0) {
    hoverGroup = hits[0].object.parent;
    hoverTarget = 1;
    document.body.style.cursor = 'pointer';
  } else {
    hoverGroup = null;
    hoverTarget = 0;
    document.body.style.cursor = 'default';
  }
});

renderer.domElement.addEventListener('mouseleave', function() {
  hoverGroup = null; hoverTarget = 0;
  document.body.style.cursor = 'default';
});

var lastMouseX = 0;

renderer.domElement.addEventListener('pointerdown', function(e) {
  dragging = true; dragStartX = e.clientX; dragDeltaX = 0;
  lastMouseX = e.clientX;
  targetX = currentX;
});
renderer.domElement.addEventListener('pointermove', function(e) {
  if (!dragging) return;
  var dx = e.clientX - lastMouseX;
  targetX -= dx * 0.015;
  targetX = Math.max(MIN_X, Math.min(MAX_X, targetX));
  lastMouseX = e.clientX;
  dragDeltaX = Math.abs(e.clientX - dragStartX);
});
renderer.domElement.addEventListener('pointerup', function(e) {
  dragging = false;
  if (dragDeltaX < 8) {
    var mouse2 = new THREE.Vector2((e.clientX/W)*2-1, -(e.clientY/H)*2+1);
    var ray2 = new THREE.Raycaster();
    ray2.setFromCamera(mouse2, camera);
    var meshes2 = [];
    cards.forEach(function(g){ g.children.forEach(function(m){ if(m.isMesh) meshes2.push(m); }); });
    var hits2 = ray2.intersectObjects(meshes2);
    if (hits2.length > 0) {
      window.location.href = hits2[0].object.parent.userData.project.path;
    }
  }
  targetX = Math.round(currentX);
});
renderer.domElement.addEventListener('wheel', function(e) {
  targetX += (e.deltaY + e.deltaX) * 0.004;
  targetX = Math.max(MIN_X, Math.min(MAX_X, targetX));
}, {passive:true});

renderer.domElement.addEventListener('pointerdown', function(e) {
  dragging = true; dragStartX = e.clientX; dragDeltaX = 0;
  lastMouseX = e.clientX;
  targetX = currentX; // 현재 위치에서 시작
});
renderer.domElement.addEventListener('pointermove', function(e) {
  if (!dragging) return;
  var dx = e.clientX - lastMouseX;
  targetX -= dx * 0.015; // 왼쪽 드래그(dx<0) → targetX 증가 → 오른쪽 카드 등장
  targetX = Math.max(MIN_X, Math.min(MAX_X, targetX));
  lastMouseX = e.clientX;
  dragDeltaX = Math.abs(e.clientX - dragStartX);
});
renderer.domElement.addEventListener('pointerup', function(e) {
  dragging = false;
  // 짧은 클릭이면 레이캐스팅으로 실제 카드 찾아 이동
  if (dragDeltaX < 8) {
    var mouse = new THREE.Vector2(
      (e.clientX/W)*2-1,
      -(e.clientY/H)*2+1
    );
    var ray = new THREE.Raycaster();
    ray.setFromCamera(mouse, camera);
    var meshes = [];
    cards.forEach(function(g){ g.children.forEach(function(m){ if(m.isMesh) meshes.push(m); }); });
    var hits = ray.intersectObjects(meshes);
    if (hits.length > 0) {
      var hitGroup = hits[0].object.parent;
      window.location.href = hitGroup.userData.project.path;
    }
  }
  // 스냅
  targetX = Math.round(currentX);
});
renderer.domElement.addEventListener('wheel', function(e) {
  targetX += (e.deltaY + e.deltaX) * 0.004;
  targetX = Math.max(MIN_X, Math.min(MAX_X, targetX));
}, {passive:true});

// 경계
var MIN_X = 0, MAX_X = projects.length - 1;

var clk = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  targetX = Math.max(MIN_X, Math.min(MAX_X, targetX));
  currentX += (targetX - currentX) * 0.1;
  layoutCards(currentX);

  // 호버 효과 — 확대 + 포인트 라이트
  var rainbowT = Date.now() * 0.002;
  cards.forEach(function(g) {
    var isHov = (g === hoverGroup);
    if (isHov) {
      g.scale.x += (1.06 - g.scale.x) * 0.12;
      g.scale.y += (1.06 - g.scale.y) * 0.12;
      g.scale.z += (1.06 - g.scale.z) * 0.12;
    }
    // 뒷면 항상 반짝 (호버 시 더 강하게)
    g.children.forEach(function(m) {
      if (!m.isMesh || m.rotation.y === 0) return;
      if (m.material.emissive) {
        var bt = Date.now()*0.0015 + g.userData.idx * 1.2;
        var strength = isHov ? 0.7 : 0.15;
        m.material.emissive.setRGB(
          (Math.sin(bt)*0.5+0.5)*strength,
          (Math.sin(bt+2.1)*0.5+0.5)*strength,
          (Math.sin(bt+4.2)*0.5+0.5)*strength
        );
        m.material.emissiveIntensity = isHov ? 1.8 : 0.8;
      }
    });
  });
  // 라이트
  if (hoverGroup) {
    hoverLight.position.set(hoverGroup.position.x, hoverGroup.position.y+0.5, hoverGroup.position.z+2);
    hoverLight.color.setHex(0xffffff);
    hoverLight.intensity += (2.5 - hoverLight.intensity) * 0.1;
  } else {
    hoverLight.intensity += (0 - hoverLight.intensity) * 0.1;
  }

  renderer.render(scene, camera);
}

// 초기 위치
cards.forEach(function(g, i) {
  g.position.set(i * SPREAD, 0, -Math.abs(i) * 1.2);
  g.rotation.y = -i * 0.38;
});

// 인트로 애니메이션 — 처음에 접혀있다가 펼쳐짐
var introTime = 0;
var INTRO_DUR = 1.2;
var originalPositions = cards.map(function(g) { return {x:0,z:-15,ry:0}; });
cards.forEach(function(g,i){g.position.set(0,0,-15);g.rotation.y=0;g.scale.setScalar(0.01);});

function animateIntro() {
  introTime += 0.016;
  var t = Math.min(introTime/INTRO_DUR, 1);
  var ease = 1 - Math.pow(1-t, 3);
  cards.forEach(function(g, i) {
    var delay = i * 0.06;
    var lt = Math.max(0, Math.min((introTime - delay)/(INTRO_DUR*0.7), 1));
    var le = 1 - Math.pow(1-lt, 3);
    var tx = i * SPREAD, tz = -Math.abs(i - (projects.length-1)*0.5) * 1.2;
    g.position.x = tx * le;
    g.position.z = -15 + (tz+15) * le;
    g.rotation.y = -(i - (projects.length-1)*0.5) * 0.38 * le;
    g.scale.setScalar(le * (1 - Math.abs(i - (projects.length-1)*0.5) * 0.08));
  });
  renderer.render(scene, camera);
  if (introTime < INTRO_DUR + cards.length * 0.06) {
    requestAnimationFrame(animateIntro);
  } else {
    animate();
  }
}

animateIntro();

window.addEventListener('resize', function(){
  W=window.innerWidth; H=window.innerHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});
</script>
</body>
</html>
